# Model-facing wording of the tool runtime (phase 1b, T14). Separate from the
# UI entries: these strings go into the request the model reads, so a
# translation must keep the format verbs (%d, %s, %v, %q, %w) of its section
# and never renames a tool, an action or a ref marker.
[model]
approved_note = [executed after manual approval]
output.saved_ref = [Output %d bytes / %d lines saved as ref %s; first locate the relevant lines with session_search(query, ref), then read nearby windows with recall(ref, offset, limit); do not page through the whole output]
output.condensed = [Output condensed: original %d bytes / %d lines
output.condensed_ref = saved as ref %s; for details use session_search(query, ref) or recall(ref, offset, limit)
deadline.prefix = [Time] Now %s (%s).\n
deadline.overdue = The task deadline %s has passed and this task is overtime: stop new work now and report what is done and what is left.
deadline.near = The task deadline is %s and the limit is near: commit the finished work and report what is left as soon as possible.
deadline.remaining = The task deadline is %s, about %d minutes left.
budget.cost = This turn has reached its cost budget ($%.4f, used $%.4f). Do not call any more tools; report directly from the information you already have. The report must state truthfully at its start that it ends because the cost budget ran out, never as a timeout or another reason; then give the conclusion, the evidence (file:line) and what is still unclear.
budget.tokens = This turn has reached its token budget (%.0f, used %.0f). Do not call any more tools; report directly from the information you already have. The report must state truthfully at its start that it ends because the token budget ran out, never as a timeout or another reason; then give the conclusion, the evidence (file:line) and what is still unclear.
memory.read_only = memory: cannot write memory in read-only mode (%s rejected); get/search still work
memory.needs_confirmation = memory: the session read external content, so a non-interactive run cannot write memory (the write that needs user confirmation was rejected)
memory.denied = memory: the session read external content, so writing memory needs confirmation, which was not given: %v
memory.tombstoned = memory: this content is the same as a previously removed entry; get the user's confirmation before writing it again (%v)
memory.over_budget = memory: the %s memory index is over its limit; merge with replace or remove old entries first, then write (%v)
memory.not_found = memory: the %s memory has no entry %q; use action=search to find the id
memory.no_backend = memory: no memory backend is configured for %s
memory.invalid = memory: invalid arguments: %v
memory.failed = memory: %s %s failed: %w
hook.pretool_error = the PreToolUse hook could not confirm, so %s was not executed: %s
hook.pretool_denied_default = the PreToolUse hook denied the execution
hook.pretool_denied = %s (%s)
tool.session_message.disabled = The tool is turned off in the configuration (tools.session_message.enabled / SUGA_SESSION_MESSAGE)
tool.session_message.in_gofer_job = This run is inside a gofer job (GOFER_JOB_ID is set), so session_message is not offered: a job has no local message endpoint, so nothing could reply to what it sends. To use it in a job, set tools.session_message.in_gofer_jobs: true in SUGA_HOME/config.yaml. Priority: tools.session_message.enabled=false or SUGA_SESSION_MESSAGE=off still turns the tool off globally (even with in_gofer_jobs: true), while SUGA_SESSION_MESSAGE cannot override in_gofer_jobs either way
tool.session_message.unavailable = Cannot resolve SUGA_HOME, so session_message is unavailable: set SUGA_HOME and retry
handoff.reuse_scope = # What to summarize\nSummarize only from the start of this segment up to the last %d messages: those last %d messages are kept verbatim in the new segment, so leave them out of the handoff package. This is not a new user request: do not answer it, do not continue the task, do not call any tool - the only output is the handoff package body.\n# Output format\nThe first line is the first heading below; every one of the seven sections must appear, write 无 when a section has nothing. Copy the headings verbatim from one of the two lists (the same list for the whole package): do not translate or reword them, do not bold them, do not number them, do not put a list marker before them:\nChinese: ## 当前任务, ## 坐标, ## 采纳与否决, ## 验证到哪, ## 进展与阻塞, ## 下一步, ## 与当前任务相关的引用\nEnglish: ## Current task, ## Coordinates, ## Adopted or rejected, ## Verified so far, ## Progress and blockers, ## Next steps, ## Related references\nThe headings are the one exception to a rule that asks for another language: copy them as listed even then; the body may be in that language.
# Accepted heading names of the package sections (the first name of each line is the canonical stored one, the names after the bar are accepted too and normalized to it; both catalogs carry the same set, so a package written in either language is recognized)
handoff.section.task = 当前任务|Current task|Current task and scope
handoff.section.coords = 坐标|Coordinates|Coordinate table
handoff.section.protected = 采纳与否决|Adopted or rejected|Decisions and rejections
handoff.section.verified = 验证到哪|Verified so far|Verification so far|What is verified
handoff.section.progress = 进展与阻塞|Progress and blockers|Progress and blocking issues|Open items
handoff.section.next = 下一步|Next steps|Next step
handoff.section.refs = 与当前任务相关的引用|Related references|References related to the current task
