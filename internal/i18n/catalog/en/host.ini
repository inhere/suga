# Host-facing diagnostics: startup/resident context notices, danger guard,
# memory write confirmation, ACP client notices, text-mode turn notices and
# clipboard platform hints. Keep keys unique within this language.
[host]
context.rules_truncated = Note: the project rules were truncated ({original} bytes read, {kept} kept); run suga inspect manifest to see each source file.
context.over_budget_total = total {bytes}/{limit} bytes
context.over_budget_part = {name} {bytes}/{limit} bytes
context.over_budget = Note: the resident context exceeds its soft thresholds ({parts}); run suga inspect manifest to see the breakdown and the suggestions.
context.skills_skipped = Note: {skipped} SKILL.md were skipped and {shadowed} skills were shadowed by the same name; run suga inspect manifest to see the reasons and sources.
skills.source.project = project
skills.source.builtin = builtin
skills.source.user = user
danger.command = Command: {command}
danger.detail = ⚠ dangerous delete: {reason}, and it cannot be undone
danger.prompt = Run {tool}? Type yes to run it, any other input refuses:
memory.title = memory: the session read external content, confirm this write
memory.need_confirm = the session read external content; writing memory needs confirmation
memory.label.scope = Scope: {scope}
memory.label.action = Action: {action}
memory.label.kind = Kind: {kind}
memory.label.id = id: {id}
memory.label.title = Title: {title}
memory.label.body = Body: {body}
memory.prompt = Write this to memory? [y] Yes [N] No [a] Do not ask again this session:
acp.sessions_hidden_xhen = {count} more origin=xhen sessions are not listed (set {meta} to true in _meta to include them)
acp.replay_summary = (the earlier conversation was compacted: {summary})\n
acp.replay_truncated = (the history is long (about {total}, above the {limit} replay limit); only the most recent {recent} messages are replayed, {dropped} earlier ones are not included)\n
acp.vision_unsupported = Note: the current model cannot see images; the {count} attached images were turned into text notes\n
wrapup.max_steps = the turn ended at the step limit ({steps} steps); the answer above only uses what was available before
wrapup.max_steps_bare = the turn ended at the step limit; the answer above only uses what was available before
wrapup.max_tokens = the turn ended because the token budget ran out; the answer above only uses what was available before
wrapup.max_cost = the turn ended because the cost budget ran out; the answer above only uses what was available before
wrapup.timeout = the turn ended at the time limit; the answer above only uses what was available before
wrapup.reason = the turn ended because of {reason}; the answer above only uses what was available before
wrapup.truncated = the wrap-up answer also hit the output limit ({limit} tokens) and was truncated; the answer may be incomplete
wrapup.truncated_bare = the wrap-up answer also hit the output limit and was truncated; the answer may be incomplete
output.truncated_fix = ; raise it with max_output_tokens (model or provider) or --max-output-tokens / SUGA_MAX_OUTPUT_TOKENS
output.truncated = the answer hit the output limit ({limit} tokens) and was truncated; it may be incomplete{fix}
output.truncated_bare = the answer hit the output limit and was truncated; it may be incomplete{fix}
retry.notice = ↻ model request failed ({error}), retrying in {wait} (attempt {attempt})
retry.restart = ; the reply above is incomplete and will be printed again
md.code_folded = … {lines} more lines (:code shows all)
clipboard.name = clipboard
clipboard.open_failed = cannot open the clipboard (another program may be holding it)
clipboard.format_failed = GetClipboardData({format}) failed
clipboard.size_unknown = the clipboard data size is unknown, cannot read it
clipboard.too_large = the clipboard data is {bytes} bytes, above the {limit} byte limit
clipboard.read_failed = failed to read the clipboard data
clipboard.header_incomplete = the clipboard bitmap header is incomplete
clipboard.bad_size = unexpected clipboard bitmap size {width}x{height}
clipboard.bad_compression = the clipboard bitmap compression is not supported ({compression})
clipboard.bad_depth = the clipboard bitmap depth is not supported ({bpp})
clipboard.convert_failed = convert the clipboard bitmap: {err}
clipboard.temp_create_failed = cannot create the clipboard temp file: {err}
clipboard.osascript_failed = failed to read the clipboard (osascript): {err}
clipboard.darwin_too_large = the clipboard data is {bytes} bytes, above {limit} bytes; not reading it
clipboard.read_temp_failed = read the clipboard temp file: {err}
clipboard.linux.missing = found neither wl-paste nor xclip: install wl-clipboard (Wayland) or xclip (X11) to paste images with Alt+V
clipboard.linux.too_large = the clipboard data is above {limit} bytes; not reading it
clipboard.unsupported_os = no clipboard reader is available on this system
