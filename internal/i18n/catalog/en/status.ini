[status]
banner.title = Suga chat
banner.session = session {name}
banner.help = Type a task to start; !<command> runs locally (!!<command> attaches its result to the next message); :session shows the session, :compact compacts context, :diff shows file changes, :quit/:exit exits; :help shows commands; Alt+Enter (Ctrl+Enter / Ctrl+J on Windows) inserts a newline, and Up/Down move the cursor in multiline input.
banner.write_tools = Tools: read/write files and run shell commands (tools.approval controls confirmation).
banner.read_only = Tools: read-only. To write files or run shell commands, set tools.allow_write: true in SUGA_HOME/config.yaml.
last_reply.label = Previous reply:
last_reply.incomplete = Previous turn did not end normally
last_reply.truncated = First {lines} lines truncated; full record: suga inspect trace {session}
turn.steers = steers {count}
turn.truncated_limit = output limit reached ({limit} tokens), answer truncated
turn.truncated = output limit reached, answer truncated
idle.running = idle consolidation in progress…
idle.done = context consolidated: {before} → {after} tokens
idle.failed = idle consolidation failed: {error}
queue.empty = no queued messages
queue.cleared = cleared {count} queued messages
queue.list = queued messages ({count}; sent in order after this turn):
session.unknown = unknown session
session.queued = message from session {name} queued (automatic reply limit reached at hop {hops}); it will be handled with your next input
session.name_taken = Note: session short name {stored} is used by another process; temporarily using {name} (stored session name remains {stored}).
session.name_save_failed = Note: session short name {name} could not be saved ({error}); a new one will be generated next time.
spinner.thinking = thinking…
spinner.tool = running {tool}…
steering.full = too many steers; wait for this step to finish
steering.waiting = (waiting for delivery)
steering.taken = (delivered)
steering.withdrawn = (withdrawn)
steering.late = (not received this turn; handled later)
