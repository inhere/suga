# Human-facing chat status lines, turn notices, tool line summaries and session
# names (area=status). Keep keys unique within this language.
[status]
banner.title = Suga chat
banner.session = session {name}
banner.help = Type a task to start; !<command> runs locally (!!<command> attaches its result to the next message); :session shows the session, :compact compacts context, :diff shows file changes, :quit/:exit exits; :help shows commands; Alt+Enter (Ctrl+Enter / Ctrl+J on Windows) inserts a newline, and Up/Down move the cursor in multiline input.
banner.write_tools = Tools: read/write files and run shell commands (tools.approval controls confirmation).
banner.read_only = Tools: read-only. To write files or run shell commands, set tools.allow_write: true in SUGA_HOME/config.yaml.
command.interrupted = Interrupted
exit.confirm = Press Ctrl+C again to exit (Ctrl+D exits at once)
last_reply.label = Previous reply:
last_reply.incomplete = Previous turn did not end normally
last_reply.truncated = First {lines} lines truncated; full record: suga inspect trace {session}
last_reply.failed = Could not read the previous reply:
local.command_busy = A local command cannot run during a turn (run it at the prompt after this turn)
undo.busy = A turn is running; run the local command once it ends
turn.steers = steers {count}
metrics.cache = cache {pct}%
metrics.ctx = ctx {pct}%
metrics.headroom = fold headroom {pct}%
metrics.background = bg {count}
turn.cancelled = Cancelled
turn.denied_tools = Tools denied this turn: {tools}
turn.notify = suga: turn finished ({elapsed})
turn.truncated_limit = output limit reached ({limit} tokens), answer truncated
turn.truncated = output limit reached, answer truncated
idle.running = idle consolidation in progress…
idle.done = context consolidated: {before} → {after} tokens
idle.failed = idle consolidation failed: {error}
spinner.thinking = thinking…
spinner.tool = running {tool}…
steering.full = too many steers; wait for this step to finish
steering.back_notice = , {count} steers put back on the input line
steering.back_hint = {count} steers put back on the input line
stop_hook.background_failed = the Stop hook could not run in the background; waiting for it instead: {error}
session.unknown = unknown session
session.queued = message from session {name} queued (automatic reply limit reached at hop {hops}); it will be handled with your next input
session.name_taken = Note: session short name {stored} is used by another process; temporarily using {name} (stored session name remains {stored}).
session.name_save_failed = Note: session short name {name} could not be saved ({error}); a new one will be generated next time.
session.socket_failed = Note: this session did not register its local session socket ({error}), so suga send and gofer deliveries cannot reach it; a shorter SUGA_HOME path helps. Chat continues.
tool.write_size = {path} ({bytes} bytes, {lines} lines)
tool.edit_count = {path} ({count} replacements)
tool.url_one = 1 URL: {url}
tool.url_many = {count} URLs: {url}, …
tool.watch_paths = watch {count} paths
exit.turns = turns this chat: {turns} · in {input} / out {output} tokens
exit.session_total = (session total in {input} / out {output})
exit.elapsed = ran {elapsed}
exit.resume = resume: {cmd}
exit.session_name = session {name}
budget.wrapup_cost = this turn wrapped up because the cost budget ran out ({usage})
budget.wrapup_tokens = this turn wrapped up because the token budget ran out ({usage})
budget.wrapup = this turn wrapped up because the budget ran out
budget.notice = budget notice: {name} already used {share}
budget.name = budget
budget.name_session = session budget
delivery.no_vision = model {model} cannot see images; the {images} attached image(s) were replaced with text notes
