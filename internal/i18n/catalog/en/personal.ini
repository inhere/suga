[personal]
scope.empty = no sessions yet
scope.other = no sessions in {dir} ({count} in other directories); the directory may be wrong—cd to the session directory or use suga session list --all to list all
usage.free_pages = {pages} free pages ({bytes}); run `suga data vacuum` to reclaim them
usage.tool_inline = {bytes} of tool results remain in the store; `suga data bodies --move` can move them to session files
usage.assistant_inline = {bytes} of assistant reasoning and tool-call arguments remain in the store; `suga data bodies --move` can move them to session files
usage.events = events are deleted with sessions: `suga data gc --retention` (or --older-than)
usage.fts_tools = the index still has {rows} tool-result rows; old stores can use `suga data shrink-fts` v0.40 to delete them
usage.fts_empty = no tool rows remain in the index; run `suga data vacuum` after deleting sessions to reclaim file space
usage.spill = spill output can be compressed with `suga data compress-spill --apply`; delete old sessions with `suga data gc --retention`
usage.sessions = session directories are deleted with sessions: `suga data gc --retention` (or --older-than)
session.recovered = The previous turn was interrupted; the session has been recovered (the interrupted turn is marked cancelled)
