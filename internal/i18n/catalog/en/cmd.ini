# Chat local commands (:help, :usage, :context, :tasks ...): the command table,
# the usage of ":<命令> -h", the answers of unknown commands/arguments and what
# the local commands print. Command names, arguments and "-h" stay untranslated.
# Multi-line text is written as the literal `\n`.
[cmd]
; --- the :help table: one summary line and one detailed usage per command
summary.session = Show this session
summary.compact = Compact the context
summary.add-dir = Authorize an extra directory
summary.dirs = List the directories
summary.rm-dir = Revoke an extra directory
summary.diff = Show the file changes
summary.code = Expand a code block of the last answer
summary.image = Manage pending images (attached to the next message)
summary.queue = List/clear queued messages (Tab queues during a turn, sent after it)
summary.checkpoints = List the write snapshots
summary.undo = Roll back file changes
summary.help = Show this help
summary.model = Show/switch the model
summary.usage = Show this session's usage and cost
summary.skills = List the loaded skills
summary.context = List what the current context is made of
summary.tasks = Background tasks: running + recently ended (-a all, -k kill)
summary.quit = Quit

usage.session = Usage: :session\n  Shows this session's id and, once the local session socket is registered, its short name (used by suga send --session <短名称>).\n\nExamples:\n  :session
usage.compact = Usage: :compact\n  Compacts this session's context now and prints the token estimate before and after.\n\nExamples:\n  :compact
usage.add-dir = Usage: :add-dir <绝对路径>[:ro|:rw]\n  Adds a directory to what this session may reach (read-only by default, :rw makes it writable). It takes effect now and is kept when the session is resumed.\n\nExamples:\n  :add-dir /data/docs:rw\n  :add-dir /data/cache
usage.dirs = Usage: :dirs\n  Lists the workspace and the added directories with read-only/read-write and where each came from (startup argument, environment variable, added in the session, outside authorization, kept from an earlier session).\n\nExamples:\n  :dirs
usage.rm-dir = Usage: :rm-dir <路径>\n  Revokes an added directory (the :ro/:rw suffix :dirs prints may be kept, it is ignored).\n\nExamples:\n  :rm-dir /data/cache
usage.diff = Usage: :diff [N]\n  Shows the file changes of this session: without N the most recent one, with N the Nth.\n\nExamples:\n  :diff\n  :diff 3
usage.code = Usage: :code [N]\n  Expands a folded code block of the last answer: without N the most recent one, with N the Nth (in the order they appear).\n\nExamples:\n  :code\n  :code 2
usage.image = Usage: :image [<路径>|clear]\n  Without an argument lists the pending images; <路径> attaches one image to the next message; clear drops them.\n\nExamples:\n  :image screenshot.png\n  :image clear
usage.queue = Usage: :queue [-d <N>|clear]\n  Without an argument lists the queued messages; -d <N> drops the Nth; clear drops them all.\n  Tab during a turn queues the input line, and each queued line runs as its own message after this turn, in order.\n\nExamples:\n  :queue\n  :queue -d 2\n  :queue clear
usage.checkpoints = Usage: :checkpoints [N]\n  Lists the write snapshots (most recent turn first); N keeps the last N turns.\n\nExamples:\n  :checkpoints\n  :checkpoints 5
usage.undo = Usage: :undo [N] [force]\n  N (default 1) is the last N turns that changed files; force also overwrites files changed after the snapshot.\n\nExamples:\n  :undo\n  :undo 2 force
usage.help = Usage: :help [<命令>]\n  Without an argument lists every command and key; with a command shows that command's usage (the same as :<命令> -h).\n\nExamples:\n  :help\n  :help :queue
usage.model = Usage: :model [<provider>/<model>]\n  Without an argument shows the current model and the available ones; with a reference switches the model (from the next turn, Tab completes model names).\n\nExamples:\n  :model\n  :model opencode-go/glm-5
usage.usage = Usage: :usage\n  Shows the turns of this session, the input/output tokens, the cache reads/writes and the cost.\n\nExamples:\n  :usage
usage.skills = Usage: :skills [--only-names] [-n N]\n  Lists the skills this session loaded: name, a one-line description and the source (project/builtin/user), sorted by name.\n  --only-names  only the names\n  -n N          at most N of them (every one by default, the tail says how many are left)\n\nExamples:\n  :skills\n  :skills --only-names -n 10
usage.context = Usage: :context [--files]\n  Lists what the current context is made of and the estimated tokens: system prompt, tool schemas (with how many are deferred and loaded),\n  the resident segment context (environment, rules, memory index, skills, extra prompts ...), the handoff package and the history messages;\n  the numbers are the ones of the context trace event.\n  --files  list only the files the context already carries (files read by file_read, rule files), most recently used first\n\nExamples:\n  :context\n  :context --files
usage.tasks = Usage: :tasks [options]\n  :tasks          list the running tasks and the 10 most recently ended ones\n  :tasks -a       list every task (ended ones included)\n  :tasks -k <ID>  kill background tasks, several at once: :tasks -k t3 t4\n  :tasks -h       show this help\nExamples: :tasks -k t2
usage.quit = Usage: :quit (same as :exit)\n  Leaves chat; unsent queued messages and deliveries that never ran are reported as dropped when leaving.\n\nExamples:\n  :quit\n  :exit

; --- the fixed tail of :help
help.keys = !<命令> runs locally; !!<命令> runs and attaches the result to the next message\nKeys: Enter/Alt+Enter/Ctrl+J submit/newline; Tab completes a command (during a turn Tab queues the line for after it); Alt+V pastes a clipboard image; Esc stops the turn; Ctrl+C clears/stops/leaves; Up during a turn takes the interjection back; Up/Down browse history
help.hint = See a command's details: :<命令> -h (for example :queue -h), or :help <命令>

; --- the one-line reminder of the added-directory commands
dirs.help = Usage: :add-dir <绝对路径>[:ro|:rw] (:ro by default), :dirs lists the directories, :rm-dir <路径> revokes one

