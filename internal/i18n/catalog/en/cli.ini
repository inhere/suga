# CLI human-facing output. Machine keys, paths, command names and JSON fields stay unchanged.
[cli]
config.written = Written {path}
config.deleted = Removed {key}
data.usage.file = Database file {path} ({bytes})
data.usage.pages = Pages
data.usage.free_pages = Free pages
data.usage.wal = WAL
data.usage.entries = entries
data.usage.assistant = assistant fields (in database)
data.usage.metadata = Metadata keys (in database)
data.usage.tool_args = Tool call arguments (in database)
data.usage.tool_stub = tool results (stubs)
data.usage.tool_inline = tool results (in database)
data.usage.moved = Moved to files
data.usage.events = events (attrs_json + error)
data.usage.fts = Full-text index
data.usage.sessions = Sessions directory
data.usage.other = Other
data.usage.tables = Tables/indexes (dbstat)
data.usage.largest = Largest sessions (database + directory):
data.usage.total = Total {total}: database {file} + sessions directory {sessions}
data.usage.no_dbstat = This SQLite build has no dbstat: entry bytes above exclude B-tree and page overhead
data.usage.actionable = Actionable:
data.gc.snapshots = snapshots: skipped {skipped} records without metadata, cleaned {repaired} partial directories
data.gc.verb.delete = will delete
data.gc.verb.deleted = deleted
data.gc.summary = {verb} {sessions} sessions ({before} not updated, including transcript files and session directories) and {events} event records, including {bytes} snapshot bytes
data.gc.apply = ; pass --apply to execute
data.gc.vacuum = ; VACUUM was not run; run `suga data vacuum` to reclaim disk space
data.retention.interactive = interactive sessions
data.retention.noninteractive = non-interactive sessions
data.retention.class = {name} (retain {retention}): {sessions} sessions, {entries} entries, estimated {bytes}
data.retention.summary = {verb} {sessions} sessions (including transcript files and session directories), estimated {bytes} reclaimed (actual bytes require `suga data vacuum`)
data.retention.apply = Run with --apply; deletion does not VACUUM; run `suga data vacuum` to reclaim disk space
data.retention.vacuum = VACUUM was not run: run `suga data vacuum` to return space to disk
send.image_unsupported = Target session {session} (process {pid}) does not support images; message not delivered. Reopen the session in a newer suga: {error}
send.image_unsupported_short = Target session {session} (process {pid}) does not support images; message not delivered. Reopen it in a newer suga
send.steer_queued = Not inserted into the current turn; queued
send.warning = Notice: {warning}
send.state = State: {state}
send.failed = Message was not processed ({state})
config.read_updated = read updated {key}
undo.no_snapshot = No snapshot to roll back (this session changed no file with a tool, or the snapshots were cleaned by tools.snapshots).
cwd.mismatch = Session {session} works in {recorded}; current working directory is {current}; `cd {recorded}` first, or use --allow-cwd-change to continue here
cwd.gone = (the directory no longer exists)
cwd.header = Session {session} was created in {recorded}\nCurrent working directory is {current}
cwd.choice.back =   1) Change to {recorded} and continue
cwd.choice.back_gone =   1) Continue in the original directory ({recorded} no longer exists; unavailable)
cwd.choice.current =   2) Continue in {current} (move the session directory here)
cwd.choice.cancel =   3) Cancel (exit without changing any data)
cwd.prompt = Choose [1/2/3]: 
cwd.cancelled = Cancelled; no data was changed
cwd.unavailable = Original directory {recorded} no longer exists; choose 2 or 3.
cwd.invalid = Enter 1, 2 or 3.
cwd.chdir_failed = Change to session directory {recorded} failed: {error} (choose 2 or 3)
backup.done = Backup complete: {files} files (tool body files {tool_files}), spill={spill}, archive={archive}
backup.valid = Validation passed: {files} files, spill={spill} (dry-run, nothing written)
backup.no_auto = Automatic pre-restore backup disabled. Type YES to continue:
backup.cancelled = restore cancelled: --no-auto-backup requires YES
backup.done_check = Restore complete, but tool body verification could not run: {error}
backup.restore_done = Restore complete: backup created at {when}
backup.check = Tool body verification: checked {checked}, missing {missing}, orphan records {orphans} ({bytes} bytes)
backup.missing = Missing tool body: {problem}
init.explicit = SUGA_CONFIG={path} is set; home config was not written
init.backup = Backed up {config} -> {backup}
init.written = Written {config}
init.exists = {config} already exists; not overwritten
image.read_failed = Reading --image #{index} ({path}) failed: {error}
image.write_failed = Writing the target session image directory failed: {error}; nothing was delivered
image.too_many = --image accepts at most {max} images, received {count}; nothing was delivered
run.image_vision = Current model {model} cannot see images, so --image cannot be used; specify a vision-capable model with --model or enable vision in the configuration
run.image_too_many = --image accepts at most {max} images, received {count}
run.image_read_failed = Reading --image #{index} ({path}) failed: {error}
schema.no_json = No JSON value was found in the answer
schema.invalid = [output schema] The answer does not satisfy the caller's JSON Schema ({rounds} correction rounds): {detail}
manifest.language = Language
stats.session = stats session {session}
data.bodies.none_tool = No tool bodies need moving: no in-ledger tool results above the threshold
data.bodies.none_assistant = No assistant bodies need moving: no in-ledger reasoning or tool-call arguments above the threshold
data.bodies.files_note = Shrinking the database waits for `suga data vacuum`; session files are always included in backups
data.gc.maintenance_warning = warning: {message}
data.gc.snapshots_report = snapshots: skipped {skipped} records without metadata, cleaned {repaired} partial directories
data.spill.off = tools.spill.compression is off: no files are compressed; refs and reading stay unchanged
data.spill.usage = spill: {sessions} sessions, {files} files ({compressed} compressed); logical {logical}, physical {physical}; {quota}
data.spill.quota = no limit (tools.spill.max_bytes=0)
data.spill.quota_set = limit {bytes}
data.spill.over = , over by {bytes}
data.spill.under = , under the limit
data.spill.over_note = New spill files are refused above tools.spill.max_bytes (tools.spill.on_quota={policy}); the output layer keeps only head and tail; old output is not deleted automatically
data.spill.more = …{count} more files not shown
data.spill.will = will compress
data.spill.did = compressed
data.spill.available = compressible (mtime older than {age} and session inactive): {count}, {before} → about {after}
data.spill.skipped = skipped: {young} files younger than compress_after, {active} files with active sessions
data.spill.dry = dry-run; pass --apply to compress (stop other suga processes; {before} → {after}, logical size and refs unchanged)
data.spill.complete = Compression complete: {count} files, {before} → {after} (logical {logical} and refs unchanged)
legacy.hint = Hint: suga {old} changed to suga {new}; the old spelling was removed in {version}
legacy.moved = note: suga {old} moved to suga {new}; ran it as the new form
legacy.data_hint = Hint: suga data {form} was removed in {version}, use {replacement}
legacy.data_migration = Hint: suga data {form} was removed in {version}; it only migrates v0.35 and earlier ledgers; use v0.40 for old-ledger migration

; --- `suga data usage` count cells (the unit travels with the number)
data.usage.cell.rows = {count} rows
data.usage.cell.lines = {count} lines
data.usage.cell.calls = {count} calls
data.usage.cell.call_count = calls
data.usage.cell.files = {count} files
data.usage.cell.moved = tool {tools} rows / assistant {assistant} rows
data.usage.cell.sessions = {count} ({instore} sessions in the database)
data.usage.cell.outputs = {files} files ({gz} .gz)

; --- `suga data bodies`: the move/undo/check reports (indentation stays in the code)
data.bodies.abort_done = Cleared the body file checkpoints; the next --move / --undo starts over
data.bodies.move_start_tool = Moving out: {rows} tool results ({bytes}) go into the session files; Ctrl-C interrupts, a rerun continues
data.bodies.move_start_assistant = Moving out: {rows} assistant entries ({bytes} in the database) go into the session files; Ctrl-C interrupts, a rerun continues
data.bodies.progress_move = Scanned to {session}/{seq}, moved {rows} ({bytes})
data.bodies.interrupted_move = Interrupted at {session}/{seq} ({rows} moved out); rerun `suga data bodies --move` to continue from here: {error}
data.bodies.move_done_tool = Move complete: {rows} tool results ({bytes}) written to the session files, {batches} write transactions
data.bodies.move_done_assistant = Move complete: {rows} assistant entries ({bytes}) written to the session files, {batches} write transactions
data.bodies.undo_none = Nothing to restore: no body was moved out to the session files
data.bodies.undo_start = Restoring: {tools} tool results and {assistant} assistant entries go back into the database (new writes stop moving out first); Ctrl-C interrupts, a rerun continues
data.bodies.progress_undo = Scanned to {session}/{seq}, restored {rows} ({bytes})
data.bodies.interrupted_undo = Interrupted at {session}/{seq} ({rows} restored); rerun `suga data bodies --undo` to continue from here: {error}
data.bodies.undo_done = Restore complete: {rows} bodies written back into the database, {batches} write transactions
data.bodies.undo_kept_files = New writes no longer move out (`--move` turns it back on); the session files are kept, add --remove-files to delete them
data.bodies.removed_files = Removed {count} session files that are no longer needed
data.bodies.status.header = Body files: threshold {threshold}, move new writes out {state}
data.bodies.status.switch_on = on
data.bodies.status.switch_off = off (after --undo)
data.bodies.status.name_legacy = still the old name ({name}); --rename-files of v0.40 renames them
data.bodies.status.name_current = renamed to {name}
data.bodies.status.names = File name: {state}; {count} files still use the old name
data.bodies.status.tool = tool: {pending} to move out ({bytes}); {moved} moved out
data.bodies.status.assistant = assistant: {pending} can move out ({bytes} in the database, reasoning and tool-call arguments included); {skipped} save no space ({skipped_bytes} in the database, left alone); {moved} moved out
data.bodies.status.files = {count} session files ({bytes})
data.bodies.status.move_tool = --move state: tool {state} (checkpoint {session}/{seq}, {rows} moved out)
data.bodies.status.move_assistant = --move state: assistant {state} (checkpoint {session}/{seq}, {rows} moved out)
data.bodies.status.undo = --undo state: {state} ({rows} restored)
data.bodies.pass.complete = complete
data.bodies.pass.running = running
data.bodies.pass.none = not started
data.bodies.check.header = Checked {checked} moved-out bodies (tool and assistant): {missing} cannot be read back
data.bodies.check.orphans = {count} orphan records ({bytes}): no stub points at them, an interrupted commit leaves them behind and they can be ignored; back up before cleaning
data.bodies.check.ok = Result: the stubs in the database and the session files agree
data.bodies.check.broken = Result: some bodies cannot be read back; do not downgrade yet. Restore the session files from a backup, or use `data bodies --undo` to restore what is still readable

; --- the per-file line of `suga data compress-spill`
data.spill.file = {verb} {ref} ({before} → {after})

; --- `suga run` closing line and the `suga session undo` confirmation
run.session_usage = (session total in {input} / out {output})
run.usage_estimated = (this turn's usage includes estimates)
undo.confirm = Roll back the file changes? [y/N]
undo.confirm.force = Force the rollback and overwrite content conflicts? [y/N]
undo.result.join = ;
undo.result.end = .

; --- `suga run --verify` text-mode diagnostics (the fix-round prompt stays Chinese: it goes to the model)
verify.check = verify #{round}: {command} → exit {exit} ({duration})
verify.timeout = timeout
verify.summary = Verification failed: {command} → exit {exit} ({rounds} checks, {replays} fix rounds)
verify.summary.timeout = · the last check timed out
verify.summary.tail = tail of the last output:
verify.failed = Verification failed: {command} → exit {exit} ({rounds} fix rounds)

; --- `suga run --output-schema` usage errors (the sentinel ErrOutputContract stays untranslated)
schema.stdin_failed = Reading --output-schema (stdin) failed:
schema.file_failed = Reading the --output-schema file failed:
schema.input_invalid = --output-schema is invalid:
schema.detail_count = {detail} ({count} errors)

; --- `--output-schema` compile errors (outschema.CompileError Kind + Params; the zh text is the error's own Message)
schema.error.empty = The output contract (JSON Schema) is empty
schema.error.syntax = The output contract is not valid JSON: {detail}
schema.error.size = The output contract exceeds the {limit} byte limit ({actual} bytes)
schema.error.toplevel = The output contract's top level must be a JSON object or a boolean
schema.error.external_ref = The output contract refers to an external resource {url} (not supported; use an inline $defs reference)
schema.error.external_ref_detail = The output contract refers to an external resource (not supported): {detail}
schema.error.unknown_draft = The output contract's $schema {draft} is not supported (supported: draft-04/06/07/2019-09/2020-12)
schema.error.invalid_schema = The output contract is invalid: {detail}
sessions.other_dirs = {count} sessions in other directories are hidden; use --all to list them
sessions.header = Sessions in current directory {cwd} (--all lists every directory)
sessions.total = {shown} of {total} sessions; -n 0 shows all
manifest.truncated = rules truncated: truncated (original {original} bytes, kept {kept})
stats.estimated = {count} estimated calls
gc.vacuum.done = VACUUM complete: sessions.db {before} → {after} (WAL {wal_before} → {wal_after})
gc.vacuum.reclaimed = Overall database {before} → {after}, reclaimed {reclaimed}
gc.vacuum.no_reclaim = Overall database {before} → {after} (no reclaimable pages this time)
