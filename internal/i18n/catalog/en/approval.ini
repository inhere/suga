# Approval and chat renderer UI text. Keep keys unique within this language.
[approval]
prompt.allow = Allow {tool}? [y] Yes [N] No [a] Always allow this tool:
prompt.allow_scope = Allow {tool}? [y] Yes [N] No [a] Always allow for this session {scope} [d] Always deny for this session:
prompt.deny_scope = Allow {tool}? [y] Yes [N] No [d] Always deny for this session:
prompt.persist.allow = Write this rule to a rules file? [u] User-level ~/.suga/approval-rules.yaml [N] This session only:
prompt.persist.deny = Write this rule to a rules file? [u] User-level ~/.suga/approval-rules.yaml [p] Project-level .suga/approval-rules.yaml [N] This session only:
notify.waiting = suga: waiting for confirmation {tool}
outside.detail.tool = Tool: {tool}
outside.detail.target = Access requested: {target}
outside.detail.directory = Directory: {path}
outside.prompt = Authorize access to {path}? [r] Read-only [w] Read-write [n] Deny:
outside.prompt_readonly = Authorize access to {path}? [r] Read-only [n] Deny (--read-only session):
scope.tool = this tool
scope.command = commands beginning with “{prefix}”
scope.target = this target
scope.directory = write to the {path}/ directory
detail.command = Command: {value}
detail.path = Path: {value}
detail.check = Check: {value}
detail.purge = Ignored regenerable content: delete permanently without recycle bin
detail.directory = Directory: {files} files, {bytes} bytes, move to recycle bin for 7 days
detail.file = File: {bytes} bytes, move to recycle bin for 7 days
detail.purge_dirs = Permanently delete {count} ignored directories: {dirs}
detail.content = Content: {bytes} bytes
detail.edits = Arguments: {value}
detail.edit_label = Edit {index}
detail.edit_at = {label}Original:\n{value}
detail.edit_to = {label}Changed to:\n{value}
detail.replace_all = {label}Replace all matches
detail.query = Query: {value}
detail.arguments = Arguments: {value}
render.prompt.waiting = ❯ (waiting for external reply) 
render.spinner = Thinking…
render.notice.interrupt_turn = Interrupted this turn
render.notice.interrupt = Interrupted
render.agent.calls = {description} {calls} calls
render.agent.running = Sub-agents: {count} running ({details})
render.agent.separator = ,
render.agent.summary = Sub-agent {description}: {calls} tool calls, took {elapsed}
render.queue = [queued] {text} {suffix}
render.interjection = [interjection] {text} {suffix}
render.followup.queued = (sent after this turn)
render.followup.sent = (sent)
render.steer.waiting = (waiting for delivery)
render.steer.taken = (delivered)
render.steer.withdrawn = (withdrawn)
render.steer.late = (not received this turn, handled later)
render.memory.add = Remembered: {title} ({scope})
render.memory.replace = Updated: {title} ({scope})
render.memory.remove = Deleted: {title} ({scope})
