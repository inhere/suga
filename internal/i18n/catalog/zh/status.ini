# chat 状态行、回合提示、工具行摘要与会话名称的人类可见文案（area=status）；
# 同一语言目录内 key 不得重复。
[status]
banner.title = Suga chat
banner.session = 会话 {name}
banner.help = 输入任务开始对话；!<命令> 直接在本地执行（!!<命令> 把结果附给下一条消息）；:session 显示会话，:compact 压缩上下文，:diff 显示文件改动，:quit/:exit 退出；:help 查看命令；Alt+Enter（Windows 上 Ctrl+Enter / Ctrl+J）在输入里换行，多行时上下键移动光标。
banner.write_tools = 工具：可读写文件、执行 shell（tools.approval 决定是否先确认）。
banner.read_only = 工具：只读。要写文件、执行 shell，在 SUGA_HOME/config.yaml 设 tools.allow_write: true。
command.interrupted = 已中断
exit.confirm = 再按一次 Ctrl+C 退出（Ctrl+D 直接退出）
last_reply.label = 上一次回复：
last_reply.incomplete = 上一回合未正常结束
last_reply.truncated = 已截断前 {lines} 行，完整记录见 suga inspect trace {session}
last_reply.failed = 读取上一次回复失败：
local.command_busy = 回合进行中不能执行本地命令（结束本轮后在提示符处运行）
undo.busy = 回合进行中，等它结束再执行本地命令
turn.steers = 插话 {count}
metrics.cache = cache {pct}%
metrics.ctx = ctx {pct}%
metrics.headroom = 折叠余量 {pct}%
metrics.background = 后台 {count}
turn.cancelled = 已取消
turn.denied_tools = 本轮被拒绝的工具：{tools}
turn.notify = suga：回合完成（{elapsed}）
turn.truncated_limit = 输出达到上限（{limit} tokens），回答被截断
turn.truncated = 输出达到上限，回答被截断
idle.running = 空闲整理中…
idle.done = 已整理上下文：{before} → {after} token
idle.failed = 空闲整理失败：{error}
spinner.thinking = 思考中…
spinner.tool = 执行 {tool}…
steering.full = 插话过多，请等本步结束
steering.back_notice = ，{count} 条插话已放回输入行
steering.back_hint = {count} 条插话已放回输入行
stop_hook.background_failed = Stop hook 未能在后台运行，改为等待：{error}
session.unknown = 未知会话
session.queued = 来自会话 {name} 的消息已排队（连续自动回复已达上限，第 {hops} 跳），下次输入时一起处理
session.name_taken = 提示：会话短名称 {stored} 已被另一个进程占用，本进程临时使用 {name}（会话里保存的名称不变，下次启动仍用 {stored}）。
session.name_save_failed = 提示：会话短名称 {name} 未能保存（{error}），下次启动会重新生成。
session.socket_failed = 提示：本会话未注册本地会话 socket（{error}），因此收不到 suga send 与 gofer 投递；建议缩短 SUGA_HOME 路径。聊天继续运行。
tool.write_size = {path} ({bytes} 字节, {lines} 行)
tool.edit_count = {path} ({count} 处)
tool.url_one = 1 个 URL：{url}
tool.url_many = {count} 个 URL：{url}, …
tool.watch_paths = watch {count} 个路径
exit.turns = 本次 {turns} 轮 · in {input} / out {output} tokens
exit.session_total = （会话累计 in {input} / out {output}）
exit.elapsed = 运行 {elapsed}
exit.resume = 续接：{cmd}
exit.session_name = 会话 {name}
budget.wrapup_cost = 本轮因成本预算用尽收尾（{usage}）
budget.wrapup_tokens = 本轮因 token 预算用尽收尾（{usage}）
budget.wrapup = 本轮因预算用尽收尾
budget.notice = 预算提醒：{name}已使用 {share}
budget.name = 预算
budget.name_session = 会话预算
delivery.no_vision = 当前模型 {model} 不支持看图，附带的 {images} 张图片已转为文字说明
