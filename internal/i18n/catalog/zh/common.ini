# Catalog rules: the section is the first key segment (for example, [common]
# plus language.name = ... produces common.language.name). Do not use `${` in
# values. Write multi-line text as the literal `\n`. Keys must not repeat across
# files in one language directory.
[common]
language = 语言
language.auto = 自动
language.zh = 中文
language.en = 英语
language.greeting = 你好 {name}
multiline = 第一行\n第二行
language.invalid = language 必须是 auto、zh 或 en（也可以使用常见别名）
