# 审批与 chat renderer 的人类可见文案；同一语言目录内 key 不得重复。
[approval]
prompt.allow = 允许执行 {tool}？[y]是 [N]否 [a]本会话总是允许该工具：
prompt.allow_scope = 允许执行 {tool}？[y]是 [N]否 [a]本会话总是允许{scope} [d]本会话总是拒绝：
prompt.deny_scope = 允许执行 {tool}？[y]是 [N]否 [d]本会话总是拒绝：
prompt.persist.allow = 把这条规则写进规则文件？[u] 用户级 ~/.suga/approval-rules.yaml [N] 只本会话：
prompt.persist.deny = 把这条规则写进规则文件？[u] 用户级 ~/.suga/approval-rules.yaml [p] 项目级 .suga/approval-rules.yaml [N] 只本会话：
notify.waiting = suga：等待确认 {tool}
outside.detail.tool = 工具：{tool}
outside.detail.target = 要访问：{target}
outside.detail.directory = 目录：{path}
outside.prompt = 授权访问 {path}？[r] 只读 [w] 读写 [n] 拒绝：
outside.prompt_readonly = 授权访问 {path}？[r] 只读 [n] 拒绝（本会话为 --read-only）：
scope.tool = 该工具
scope.command = “{prefix}”开头的命令
scope.target = 该目标
scope.directory = 写入 {path}/ 目录
detail.command = 命令：{value}
detail.path = 路径：{value}
detail.check = 检查：{value}
detail.purge = 被忽略的可再生内容：直接永久删除，不进回收区
detail.directory = 目录：{files} 个文件，{bytes} 字节，移入回收区保留 7 天
detail.file = 文件：{bytes} 字节，移入回收区保留 7 天
detail.purge_dirs = 直接永久删除 {count} 个被忽略的目录：{dirs}
detail.content = 内容：{bytes} 字节
detail.edits = 参数：{value}
detail.edit_label = 第 {index} 处
detail.edit_at = {label}原文：\n{value}
detail.edit_to = {label}改为：\n{value}
detail.replace_all = {label}替换全部匹配处
detail.query = 查询：{value}
detail.arguments = 参数：{value}
render.prompt.waiting = ❯ (可等待外部回复) 
render.spinner = 思考中…
render.notice.interrupt_turn = 已中断本轮
render.notice.interrupt = 已中断
render.agent.calls = {description} {calls} 次调用
render.agent.running = 子 agent：{count} 个运行中（{details}）
render.agent.separator = 、
render.agent.summary = 子 agent {description}：{calls} 次工具调用，耗时 {elapsed}
render.queue = [排队] {text}{suffix}
render.interjection = [插话] {text}{suffix}
render.followup.queued = （本轮结束后发送）
render.followup.sent = （已发送）
render.steer.waiting = （等待送达）
render.steer.taken = （已送达）
render.steer.withdrawn = （已撤回）
render.steer.late = （本轮未接收，稍后处理）
render.memory.add = 已记住：{title}（{scope}）
render.memory.replace = 已更新：{title}（{scope}）
render.memory.remove = 已删除：{title}（{scope}）
