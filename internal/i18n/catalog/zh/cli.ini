# CLI 人类可见输出；机器 key、路径、命令名和 JSON 字段保持不变。
[cli]
config.written = 已写入 {path}
config.deleted = 已删除 {key}
data.usage.file = 库文件 {path}（{bytes}）
data.usage.pages = 页
data.usage.free_pages = 空闲页
data.usage.wal = WAL
data.usage.entries = entries
data.usage.assistant = assistant 字段（库内）
data.usage.metadata = Metadata 键（库内）
data.usage.tool_args = 工具调用参数（库内）
data.usage.tool_stub = tool 结果（桩）
data.usage.tool_inline = tool 结果（库内）
data.usage.moved = 已移出到文件
data.usage.events = events（attrs_json + error）
data.usage.fts = 全文索引
data.usage.sessions = 会话目录
data.usage.other = 其他
data.usage.tables = 表/索引（dbstat）
data.usage.largest = 最大的会话（库内 + 目录）：
data.usage.total = 合计 {total}：库文件 {file} + 会话目录 {sessions}
data.usage.no_dbstat = 本次构建的 SQLite 没有 dbstat：上面的条目字节不含 B 树与页内开销
data.usage.actionable = 可处理：
data.gc.snapshots = snapshots: 跳过 {skipped} 个缺元数据的记录，清理 {repaired} 个半成品目录
data.gc.verb.delete = 将删除
data.gc.verb.deleted = 已删除
data.gc.summary = {verb} {sessions} 个会话（{before} 之前未更新，含其 transcript 文件与会话目录）与 {events} 条事件记录，含 snapshots {bytes} 字节
data.gc.apply = ；加 --apply 执行
data.gc.vacuum = ；VACUUM 未执行，要回收磁盘空间再运行 `suga data vacuum`
data.retention.interactive = 交互会话
data.retention.noninteractive = 非交互会话
data.retention.class = {name}（保留 {retention}）：{sessions} 个会话，{entries} 条条目，预计 {bytes}
data.retention.host = 由宿主管理（origin=xhen）：未清理 {count} 个会话（生命周期由宿主决定；--older-than 显式清理仍会删除）
data.retention.summary = {verb} {sessions} 个会话（含其 transcript 文件与会话目录），预计释放 {bytes}（实际字节要等 `suga data vacuum`）
data.retention.apply = 加 --apply 执行；删除本身不 VACUUM，要回收磁盘空间再运行 `suga data vacuum`
data.retention.vacuum = VACUUM 未执行：要把空间还给磁盘再运行 `suga data vacuum`
send.image_unsupported = 目标会话 {session}（进程 {pid}）的 suga 版本不支持附图，未投递消息；请在新版本里重新打开该会话：{error}
send.image_unsupported_short = 目标会话 {session}（进程 {pid}）的 suga 版本不支持附图，未投递消息；请在新版本里重新打开该会话
send.steer_queued = 未插入当前回合，已排队
send.warning = 提示：{warning}
send.state = 状态：{state}
send.failed = 消息未处理（{state}）
config.read_updated = 读取更新后的 {key}
undo.no_snapshot = 没有可回滚的快照（本会话没有写工具改动，或快照已按 tools.snapshots 清理）。
cwd.mismatch = 会话 {session} 的工作目录是 {recorded}，当前工作目录是 {current}；请先 `cd {recorded}` 再续接，或加 --allow-cwd-change 明确在当前目录继续
cwd.gone = （该目录已不存在）
cwd.header = 会话 {session} 创建于目录 {recorded}\n当前工作目录是 {current}
cwd.choice.back =   1) 切到 {recorded} 续接
cwd.choice.back_gone =   1) 切到原目录续接（{recorded} 已不存在，不可选）
cwd.choice.current =   2) 在 {current} 继续（把会话目录改为这里）
cwd.choice.cancel =   3) 取消（直接退出，不改动任何数据）
cwd.prompt = 请选择 [1/2/3]: 
cwd.cancelled = 已取消，未改动任何数据。
cwd.unavailable = 原目录 {recorded} 已不存在，只能选 2 或 3。
cwd.invalid = 请输入 1、2 或 3。
cwd.chdir_failed = 切换到会话目录 {recorded} 失败：{error}（可改选 2 或 3）
backup.done = 备份完成：{files} 个文件（tool 正文文件 {tool_files} 个），spill={spill}，归档={archive}
backup.valid = 校验通过：{files} 个文件，spill={spill}（dry-run，未写入）
backup.no_auto = 已禁用恢复前自动备份。请输入 YES 确认继续：
backup.cancelled = restore cancelled: --no-auto-backup requires YES
backup.done_check = 恢复已完成，但 tool 正文校验未能运行：{error}
backup.restore_done = 恢复完成：备份创建时间 {when}
backup.check = tool 正文校验：检查 {checked} 条，缺失 {missing} 条，无引用的记录 {orphans} 条（{bytes} 字节）
backup.missing = 缺少 tool 正文：{problem}
init.explicit = 已指定 SUGA_CONFIG={path}，未写入 home config
init.backup = 已备份 {config} -> {backup}
init.written = 已写入 {config}
init.exists = 已存在 {config}，未覆盖
image.read_failed = 读取 --image 第 {index} 个（{path}）失败：{error}
image.write_failed = 写入目标会话的图片目录失败：{error}；未投递任何内容
image.too_many = --image 最多 {max} 张，收到 {count} 张；未投递任何内容
run.image_vision = 当前模型 {model} 不支持看图，无法使用 --image 附图；请用 --model 指定支持看图的模型，或在配置中为该模型开启 vision
run.image_too_many = --image 最多 {max} 张，收到 {count} 张
run.image_read_failed = 读取 --image 第 {index} 个（{path}）失败：{error}
schema.no_json = 回答里没有找到 JSON 值
schema.invalid = [output schema] 回答不符合调用方的 JSON Schema（已纠正 {rounds} 次）：{detail}
manifest.language = 语言
stats.session = stats session {session}
data.bodies.none_tool = tool 正文无需移出：没有超过阈值的库内 tool 结果
data.bodies.none_assistant = assistant 正文无需移出：没有超过阈值的库内推理内容或工具调用参数
data.bodies.files_note = 库文件缩小要等 `suga data vacuum`；会话文件在备份里始终包含
data.gc.maintenance_warning = warning: {message}
data.gc.snapshots_report = snapshots: 跳过 {skipped} 个缺元数据的记录，清理 {repaired} 个半成品目录
data.spill.off = tools.spill.compression 为 off：不压缩任何文件，ref 与读取方式保持不变
data.spill.usage = spill：{sessions} 个会话、{files} 个文件（其中已压缩 {compressed} 个）；逻辑 {logical}，占用 {physical}；{quota}
data.spill.quota = 未设上限（tools.spill.max_bytes=0）
data.spill.quota_set = 上限 {bytes}
data.spill.over = ，已超额 {bytes}
data.spill.under = ，未超额
data.spill.over_note = 超过 tools.spill.max_bytes 时新的 spill 会被拒绝（tools.spill.on_quota={policy}），输出层只保留头尾；不会自动删除旧输出
data.spill.more = …另有 {count} 个文件未列出
data.spill.will = 将压缩
data.spill.did = 已压缩
data.spill.available = 可压缩（mtime 早于 {age} 且会话不活跃）：{count} 个，占用 {before} → 压缩后约 {after}
data.spill.skipped = 跳过：mtime 未超过 compress_after 的 {young} 个，会话仍活跃的 {active} 个
data.spill.dry = dry-run；加 --apply 执行压缩（需停止其他 suga 进程，占用 {before} → {after}，逻辑大小与 ref 不变）
data.spill.complete = 压缩完成：{count} 个文件，占用 {before} → {after}（逻辑 {logical} 不变，ref 不变）
legacy.hint = 提示：suga {old} 已改为 suga {new}，旧写法已在 {version} 移除
legacy.data_hint = 提示：suga data {form} 已在 {version} 移除，改用 {replacement}
sessions.other_dirs = 另有 {count} 个其它目录的会话未列出，可用 --all 查看
sessions.xhen_hidden = 另有 {count} 个 origin=xhen 的会话未列出（--origin xhen 查看，--origin all 列出全部来源）
sessions.header = 当前目录 {cwd} 的会话（--all 列出全部）
sessions.total = {shown} of {total} sessions; -n 0 shows all
manifest.truncated = rules truncated: 已截断（原 {original} 字节，保留 {kept}）
stats.estimated = {count} 次估算
gc.vacuum.done = VACUUM 完成：sessions.db {before} → {after}（WAL {wal_before} → {wal_after}）
gc.vacuum.reclaimed = 库文件总体 {before} → {after}，回收 {reclaimed}
gc.vacuum.no_reclaim = 库文件总体 {before} → {after}（本次没有可回收的页）
legacy.data_migration = 提示：suga data {form} 已在 {version} 移除；它只用于把 v0.35 及更早的库迁移到当前格式，若需迁移旧库请用 v0.40

; --- `suga data usage` count cells (the unit travels with the number)
data.usage.cell.rows = {count} 条
data.usage.cell.lines = {count} 行
data.usage.cell.calls = {count} 次
data.usage.cell.call_count = 调用次数
data.usage.cell.files = {count} 个文件
data.usage.cell.moved = tool {tools} 条 / assistant {assistant} 条
data.usage.cell.sessions = {count} 个（库内 {instore} 个会话）
data.usage.cell.outputs = {files} 个文件（.gz {gz}）

; --- `suga data bodies`: the move/undo/check reports (indentation stays in the code)
data.bodies.abort_done = 已清除正文文件断点；下次 --move / --undo 会从头开始
data.bodies.move_start_tool = 开始移出：{rows} 条 tool 结果（{bytes}）将写入会话文件，Ctrl-C 可中断，重跑续上
data.bodies.move_start_assistant = 开始移出：{rows} 条 assistant 条目（库内 {bytes}）将写入会话文件，Ctrl-C 可中断，重跑续上
data.bodies.progress_move = 已扫到 {session}/{seq}，移出 {rows} 条（{bytes}）
data.bodies.interrupted_move = 中断于 {session}/{seq}（已移出 {rows} 条）；重跑 `suga data bodies --move` 从这里续上：{error}
data.bodies.move_done_tool = 移出完成：{rows} 条 tool 结果（{bytes}）写入会话文件，{batches} 个写事务
data.bodies.move_done_assistant = 移出完成：{rows} 条 assistant 条目（{bytes}）写入会话文件，{batches} 个写事务
data.bodies.undo_none = 已还原：没有移出到会话文件的正文
data.bodies.undo_start = 开始还原：{tools} 条 tool 结果与 {assistant} 条 assistant 条目将写回库内（先关闭「新写入移出」开关），Ctrl-C 可中断，重跑续上
data.bodies.progress_undo = 已扫到 {session}/{seq}，还原 {rows} 条（{bytes}）
data.bodies.interrupted_undo = 中断于 {session}/{seq}（已还原 {rows} 条）；重跑 `suga data bodies --undo` 从这里续上：{error}
data.bodies.undo_done = 还原完成：{rows} 条正文写回库内，{batches} 个写事务
data.bodies.undo_kept_files = 新写入已不再移出（`--move` 可重新打开）；会话文件仍保留，可加 --remove-files 删除
data.bodies.removed_files = 已删除 {count} 个不再需要的会话文件
data.bodies.status.header = 正文文件：阈值 {threshold}，新写入移出开关{state}
data.bodies.status.switch_on = 已打开
data.bodies.status.switch_off = 已关闭（--undo 之后）
data.bodies.status.name_legacy = 仍是旧名（{name}）；v0.40 的 --rename-files 可改名
data.bodies.status.name_current = 已改用 {name}
data.bodies.status.names = 文件名：{state}；旧名文件 {count} 个
data.bodies.status.tool = tool：待移出 {pending} 条（{bytes}）；已移出 {moved} 条
data.bodies.status.assistant = assistant：可移出 {pending} 条（库内 {bytes}，含推理内容与工具调用参数）；移出不省空间 {skipped} 条（库内 {skipped_bytes}，不处理）；已移出 {moved} 条
data.bodies.status.files = 会话文件 {count} 个（{bytes}）
data.bodies.status.move_tool = --move 状态：tool {state}（断点 {session}/{seq}，已移出 {rows} 条）
data.bodies.status.move_assistant = --move 状态：assistant {state}（断点 {session}/{seq}，已移出 {rows} 条）
data.bodies.status.undo = --undo 状态：{state}（已还原 {rows} 条）
data.bodies.pass.complete = 已完成
data.bodies.pass.running = 进行中
data.bodies.pass.none = 未开始
data.bodies.check.header = 校验了 {checked} 条移出的正文（tool 与 assistant）：{missing} 条读不回正文
data.bodies.check.orphans = 孤儿记录 {count} 条（{bytes}）：没有桩指向它们，是提交前中断留下的，可忽略；需要清理时请先备份
data.bodies.check.ok = 结论：库内桩与会话文件一致
data.bodies.check.broken = 结论：有正文读不回，先别回退版本；可从备份恢复会话文件，或用 `data bodies --undo` 还原仍可读的部分

; --- the per-file line of `suga data compress-spill`
data.spill.file = {verb} {ref}（{before} → {after}）

; --- `suga run` closing line and the `suga undo` confirmation
run.session_usage = （会话累计 in {input} / out {output}）
run.usage_estimated = （其中本轮用量含估算）
undo.confirm = 确认回滚文件改动？[y/N]
undo.confirm.force = 确认强制回滚并覆盖内容冲突？[y/N]
undo.result.join = ；
undo.result.end = 。

; --- `suga run --verify` text-mode diagnostics (the fix-round prompt stays Chinese: it goes to the model)
verify.check = verify #{round}: {command} → exit {exit} ({duration})
verify.timeout = 超时
verify.summary = 验证未通过：{command} → exit {exit}（共验证 {rounds} 次，含 {replays} 轮回灌）
verify.summary.timeout = · 最后一次超时
verify.summary.tail = 最后一次输出尾部:
verify.failed = 验证未通过: {command} → exit {exit}（已回灌 {rounds} 轮）

; --- `suga run --output-schema` usage errors (the sentinel ErrOutputContract stays untranslated)
schema.stdin_failed = 读取 --output-schema（stdin）失败:
schema.file_failed = 读取 --output-schema 文件失败:
schema.input_invalid = --output-schema 无效:
schema.detail_count = {detail}（共 {count} 条）
