# Chat local commands (:help, :usage, :context, :tasks ...): the command table,
# the usage of ":<命令> -h", the answers of unknown commands/arguments and what
# the local commands print. Command names, arguments and "-h" stay untranslated.
# Multi-line text is written as the literal `\n`.
[cmd]
; --- the :help table: one summary line and one detailed usage per command
summary.session = 显示会话
summary.compact = 压缩上下文
summary.add-dir = 授权附加目录
summary.dirs = 列出目录
summary.rm-dir = 撤销附加目录
summary.diff = 显示文件改动
summary.code = 展开上一条回答的代码块
summary.image = 管理待发图片（附到下一条消息）
summary.queue = 列出/清空排队的消息（回合中 Tab 排队，本轮结束后发送）
summary.checkpoints = 列出写操作快照
summary.undo = 回滚文件改动
summary.help = 显示此帮助
summary.model = 查看/切换模型
summary.usage = 显示本会话用量与成本
summary.skills = 列出已加载的 skills
summary.context = 列出当前上下文的构成
summary.tasks = 后台任务：运行中+最近结束（-a 全部，-k 终止）
summary.quit = 退出

usage.session = 用法：:session\n  显示本会话的 id，以及注册本地会话 socket 后得到的短名称（suga send --session <短名称> 用它）。\n\n示例：\n  :session
usage.compact = 用法：:compact\n  立即压缩本会话的上下文，并打印压缩前后的 token 估算。\n\n示例：\n  :compact
usage.add-dir = 用法：:add-dir <绝对路径>[:ro|:rw]\n  把一个目录加入本会话可访问的范围（默认只读，:rw 可写）。本会话立即生效，续接沿用。\n\n示例：\n  :add-dir /data/docs:rw\n  :add-dir /data/cache
usage.dirs = 用法：:dirs\n  列出工作区与附加目录，含只读/读写与来源（启动参数、环境变量、会话中追加、越界授权、会话沿用）。\n\n示例：\n  :dirs
usage.rm-dir = 用法：:rm-dir <路径>\n  撤销一个附加目录（:dirs 打印的 :ro/:rw 后缀可带上，会被忽略）。\n\n示例：\n  :rm-dir /data/cache
usage.diff = 用法：:diff [N]\n  显示本会话的文件改动：不带 N 显示最近一次，N 显示第 N 次。\n\n示例：\n  :diff\n  :diff 3
usage.code = 用法：:code [N]\n  展开上一条回答里被折叠的代码块：不带 N 展开最近一个，N 展开第 N 个（按出现顺序）。\n\n示例：\n  :code\n  :code 2
usage.image = 用法：:image [<路径>|clear]\n  不带参数列出待发送的图片；<路径> 把一张图附到下一条消息；clear 清空待发图片。\n\n示例：\n  :image screenshot.png\n  :image clear
usage.queue = 用法：:queue [-d <N>|clear]\n  不带参数列出排队的消息；-d <N> 删除第 N 条；clear 清空。\n  回合中按 Tab 把输入行排队，本轮结束后按顺序各作为一条消息发送。\n\n示例：\n  :queue\n  :queue -d 2\n  :queue clear
usage.checkpoints = 用法：:checkpoints [N]\n  列出写操作快照（最近的回合在前）；N 只看最近 N 个回合。\n\n示例：\n  :checkpoints\n  :checkpoints 5
usage.undo = 用法：:undo [N] [force]\n  N（默认 1）为最近 N 个有文件改动的回合；force 同时覆盖快照之后被改动过的文件。\n\n示例：\n  :undo\n  :undo 2 force
usage.help = 用法：:help [<命令>]\n  不带参数列出全部命令与按键；带命令显示该命令的用法（等同 :<命令> -h）。\n\n示例：\n  :help\n  :help :queue
usage.model = 用法：:model [<provider>/<model>]\n  不带参数显示当前模型与可选模型；带引用切换模型（下一回合生效，Tab 可补全模型名）。\n\n示例：\n  :model\n  :model opencode-go/glm-5
usage.usage = 用法：:usage\n  显示本次会话的轮数、输入/输出 token、缓存读/写与成本。\n\n示例：\n  :usage
usage.skills = 用法：:skills [--only-names] [-n N]\n  列出本会话加载的 skills：名字、一句说明与来源（项目/内置/用户），按名字排序。\n  --only-names  只列名字\n  -n N          最多列 N 条（默认全部，末尾提示还有几条）\n\n示例：\n  :skills\n  :skills --only-names -n 10
usage.context = 用法：:context [--files]\n  列出当前上下文的构成与估算 token：系统提示、工具 schema（含按需加载与已加载数量）、\n  常驻的段上下文（环境、规则、记忆索引、skills、附加提示等）、交接包与历史消息；\n  数字口径与 context trace 事件一致。\n  --files  只列出上下文已加载的文件（file_read 读过的文件、规则文件），最近使用在前\n\n示例：\n  :context\n  :context --files
usage.tasks = 用法：:tasks [选项]\n  :tasks          列出运行中的任务和最近 10 条已结束任务\n  :tasks -a       列出全部任务（含已结束的）\n  :tasks -k <ID>  终止后台任务，可写多个：:tasks -k t3 t4\n  :tasks -h       显示此帮助\n示例：:tasks -k t2
usage.quit = 用法：:quit（同 :exit）\n  退出 chat；未发送的排队消息、没轮到运行的投递会在退出时提示丢弃。\n\n示例：\n  :quit\n  :exit

; --- the fixed tail of :help
help.keys = !<命令> 本地执行；!!<命令> 执行并附给下一条消息\n按键：Enter/Alt+Enter/Ctrl+J 提交/换行；Tab 补全命令（回合中 Tab 把该行排到本轮结束后发送）；Alt+V 贴剪贴板图片；Esc 中止本轮；Ctrl+C 清空/中止/退出；回合中 Up 撤回插话；Up/Down 浏览历史
help.hint = 查看命令详情：:<命令> -h（如 :queue -h），或 :help <命令>

; --- the one-line reminder of the added-directory commands
dirs.help = 用法：:add-dir <绝对路径>[:ro|:rw]（默认 :ro），:dirs 列出目录，:rm-dir <路径> 撤销

; --- unknown command and argument answers
unknown.none = 未知命令 {name}；:help 列出全部命令
unknown.suggest = 未知命令 {name}，是否想用 {first}？（相近：{others}；:help 列出全部命令）
unknown.command = 未知命令：{name}；:help 列出全部命令
unknown.arg = 未知参数：{arg}
unknown.arg.usage = 未知参数：{arg}\n{usage}

; --- :usage and :tasks
usage.stats = :usage 用量：本次 {turns} 轮 · 输入 {input} / 输出 {output} · 缓存读 {cache_read} / 写 {cache_write} · 成本 {cost}；会话累计输入 {session_input} / 输出 {session_output} · 成本 {session_cost}
tasks.empty = 没有后台任务
tasks.more = 还有 {count} 条已结束任务，:tasks -a 查看全部
tasks.line = {id} · {status} · {summary} · 已运行 {elapsed} · 最近输出 {last} · {kind}
tasks.kill.ended = 任务 {id} 已结束（{status}），无需终止
tasks.kill.unknown = 没有任务 {id}
tasks.kill.failed = 终止任务 {id} 失败：{error}
tasks.kill.ok = 已终止任务 {id}：{summary}

; --- :image and the clipboard paste
image.unavailable = 图片附件在本进程不可用
image.vision = 当前模型 {model} 不支持看图，无法附图；请用 :model 切换到支持看图的模型
image.limit = 待发图片已达上限（{max} 张），请先发送或 :image clear
image.read_failed = 读图失败：{error}
image.attached = [已附图 {count}：{width}×{height} {type}] 将随下一条消息发送
image.clipboard_unavailable = Alt+V 贴图在本进程不可用
image.clipboard_failed = Alt+V：{error}
image.none = 没有待发的图片
image.line = [已附图 {index}：{width}×{height} {type}]
image.cleared = 已清空待发图片

; --- :model
model.current = 当前模型：{model}\n思考级别：{thinking}\n上下文窗口：{window}\n输出上限 max_output_tokens：{max_output}\n可选模型：
model.none = 无
model.thinking.default = 默认
model.switch.unavailable = 模型切换不可用
model.switch.failed = 模型切换失败：{error}
model.switch.ok = 已切换模型：{model}（下一回合生效）

