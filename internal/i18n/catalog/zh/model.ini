# Model-facing wording of the tool runtime (phase 1b, T14). Separate from the
# UI entries: these strings go into the request the model reads, so a
# translation must keep the format verbs (%d, %s, %v, %q, %w) of its section
# and never renames a tool, an action or a ref marker.
[model]
approved_note = [已经人工批准执行]
output.saved_ref = [输出 %d 字节 / %d 行已保存为 ref %s；先用 session_search(query, ref) 定位相关行，再用 recall(ref, offset, limit) 读附近窗口，不要逐页读完]
output.condensed = [已整理输出：原文 %d 字节 / %d 行
output.condensed_ref = 已保存为 ref %s，需要细节时用 session_search(query, ref) 或 recall(ref, offset, limit)
deadline.prefix = [时间] 现在 %s（%s），
deadline.overdue = 已超过本任务截止 %s，本任务已超时：请立即停止新的工作，直接汇报已完成与未完成的部分。
deadline.near = 本任务截止 %s，即将到达时限：请尽快提交已完成的工作并汇报未完成项。
deadline.remaining = 本任务截止 %s，剩余约 %d 分钟。
budget.cost = 本回合已达到成本预算上限（$%.4f，已用 $%.4f）。不要再调用任何工具，直接根据目前已获得的信息给出报告。报告开头必须如实写明：本次是因成本预算用尽而收尾，不得写成超时或其它原因；然后给出结论、证据（文件:行号）、尚未查清的部分。
budget.tokens = 本回合已达到 token 预算上限（%.0f，已用 %.0f）。不要再调用任何工具，直接根据目前已获得的信息给出报告。报告开头必须如实写明：本次是因 token 预算用尽而收尾，不得写成超时或其它原因；然后给出结论、证据（文件:行号）、尚未查清的部分。
memory.read_only = memory: 只读模式下不能写入记忆（%s 被拒绝）；get/search 仍可使用
memory.needs_confirmation = memory: 会话读过外部内容，非交互模式不能写记忆（需要用户确认的写入被拒绝）
memory.denied = memory: 会话读过外部内容，写入需要确认，未获同意：%v
memory.tombstoned = memory: 该内容与之前删除的条目相同，重新写入前先征得用户确认（%v）
memory.over_budget = memory: %s 记忆索引超出上限，先用 replace 合并或用 remove 删除旧条目再写入（%v）
memory.not_found = memory: %s 中没有条目 %q；用 action=search 查找 id
memory.no_backend = memory: 没有为 %s 配置记忆后端
memory.invalid = memory: 参数无效：%v
memory.failed = memory: %s %s 失败：%w
hook.pretool_error = 调用前 hook 未能确认，已拒绝执行 %s：%s
hook.pretool_denied_default = 调用前 hook 拒绝执行
hook.pretool_denied = %s（%s）
tool.session_message.disabled = 该工具已在配置中关闭（tools.session_message.enabled / SUGA_SESSION_MESSAGE）
tool.session_message.in_gofer_job = 本次运行在 gofer job 内（已设置 GOFER_JOB_ID），默认不提供 session_message：job 没有本地消息端点，发出的消息无法回传结果。要在 job 内使用，在 SUGA_HOME/config.yaml 设 tools.session_message.in_gofer_jobs: true；优先级：tools.session_message.enabled=false 或 SUGA_SESSION_MESSAGE=off 仍是全局关闭（即使设了 in_gofer_jobs 也不提供），反过来 SUGA_SESSION_MESSAGE 打开也不能越过 in_gofer_jobs
tool.session_message.unavailable = 无法确定 SUGA_HOME，session_message 不可用：设置 SUGA_HOME 后重试
handoff.reuse_scope = # 需要概括的范围\n只概括从本段开头到倒数第 %d 条消息之前的内容；最后的 %d 条消息会原样保留到新的一段，不要写进交接包。这不是用户的新请求：不要回答它、不要继续当前任务、不要调用工具，唯一的输出就是交接包正文。\n# 输出格式\n第一行就是下列第一个标题，七个小节都要出现，没有内容的小节写“无”。标题原样照抄下面两组写法中的一组（整份交接包统一用同一组），不要翻译、不要改写、不要加粗、不要编号、不要在标题前加列表符号：\n中文：## 当前任务、## 坐标、## 采纳与否决、## 验证到哪、## 进展与阻塞、## 下一步、## 与当前任务相关的引用\nEnglish: ## Current task、## Coordinates、## Adopted or rejected、## Verified so far、## Progress and blockers、## Next steps、## Related references\n标题是唯一例外：即使本会话的规则要求用别的语言回答，标题也照抄上面列出的写法，正文可以用该语言。
# 交接包小节的可用标题名（每一行第一个是存储用的规范名，竖线后是同样接受的写法；两个语种的词条内容相同，会话用哪种语言写正文都能识别）
handoff.section.task = 当前任务|Current task|Current task and scope
handoff.section.coords = 坐标|Coordinates|Coordinate table
handoff.section.protected = 采纳与否决|Adopted or rejected|Decisions and rejections
handoff.section.verified = 验证到哪|Verified so far|Verification so far|What is verified
handoff.section.progress = 进展与阻塞|Progress and blockers|Progress and blocking issues|Open items
handoff.section.next = 下一步|Next steps|Next step
handoff.section.refs = 与当前任务相关的引用|Related references|References related to the current task
