# Model-facing wording of the tool runtime (phase 1b, T14). Separate from the
# UI entries: these strings go into the request the model reads, so a
# translation must keep the format verbs (%d, %s, %v, %q, %w) of its section
# and never renames a tool, an action or a ref marker.
[model]
approved_note = [已经人工批准执行]
output.saved_ref = [输出 %d 字节 / %d 行已保存为 ref %s；先用 session_search(query, ref) 定位相关行，再用 recall(ref, offset, limit) 读附近窗口，不要逐页读完]
output.condensed = [已整理输出：原文 %d 字节 / %d 行
output.condensed_ref = 已保存为 ref %s，需要细节时用 session_search(query, ref) 或 recall(ref, offset, limit)
deadline.prefix = [时间] 现在 %s（%s），
deadline.overdue = 已超过本任务截止 %s，本任务已超时：请立即停止新的工作，直接汇报已完成与未完成的部分。
deadline.near = 本任务截止 %s，即将到达时限：请尽快提交已完成的工作并汇报未完成项。
deadline.remaining = 本任务截止 %s，剩余约 %d 分钟。
budget.cost = 本回合已达到成本预算上限（$%.4f，已用 $%.4f）。不要再调用任何工具，直接根据目前已获得的信息给出报告。报告开头必须如实写明：本次是因成本预算用尽而收尾，不得写成超时或其它原因；然后给出结论、证据（文件:行号）、尚未查清的部分。
budget.tokens = 本回合已达到 token 预算上限（%.0f，已用 %.0f）。不要再调用任何工具，直接根据目前已获得的信息给出报告。报告开头必须如实写明：本次是因 token 预算用尽而收尾，不得写成超时或其它原因；然后给出结论、证据（文件:行号）、尚未查清的部分。
memory.read_only = memory: 只读模式下不能写入记忆（%s 被拒绝）；get/search 仍可使用
memory.needs_confirmation = memory: 会话读过外部内容，非交互模式不能写记忆（需要用户确认的写入被拒绝）
memory.denied = memory: 会话读过外部内容，写入需要确认，未获同意：%v
memory.tombstoned = memory: 该内容与之前删除的条目相同，重新写入前先征得用户确认（%v）
memory.over_budget = memory: %s 记忆索引超出上限，先用 replace 合并或用 remove 删除旧条目再写入（%v）
memory.not_found = memory: %s 中没有条目 %q；用 action=search 查找 id
memory.no_backend = memory: 没有为 %s 配置记忆后端
memory.invalid = memory: 参数无效：%v
memory.failed = memory: %s %s 失败：%w
hook.pretool_error = 调用前 hook 未能确认，已拒绝执行 %s：%s
hook.pretool_denied_default = 调用前 hook 拒绝执行
hook.pretool_denied = %s（%s）
handoff.reuse_scope = # 需要概括的范围\n只概括从本段开头到倒数第 %d 条消息之前的内容；最后的 %d 条消息会原样保留到新的一段，不要写进交接包。不要调用工具，不要继续当前任务，只按上面的结构输出交接包正文。
