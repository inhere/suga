[personal]
scope.empty = 还没有任何会话
scope.other = 当前目录 {dir} 没有会话（其它目录共有 {count} 个）；目录可能不对，可 cd 到会话所在目录，或用 suga session list --all 列出全部
usage.free_pages = 有 {pages} 个空闲页（{bytes}），`suga data vacuum` 可回收
usage.tool_inline = 库内 tool 结果 {bytes}，`suga data bodies --move` 可移到会话文件
usage.assistant_inline = 库内 assistant 的推理内容与工具调用参数 {bytes}，`suga data bodies --move` 可移到会话文件
usage.events = 事件随会话一起删除：`suga data gc --retention`（或 --older-than）
usage.fts_tools = 索引里还有 {rows} 行 tool 结果，旧库可用 v0.40 的 `suga data shrink-fts` 删除它们
usage.fts_empty = 索引已无 tool 行；删除会话后执行 `suga data vacuum` 让文件回落
usage.spill = spill 输出可用 `suga data compress-spill --apply` 压缩空闲文件；旧会话用 `suga data gc --retention` 删除
usage.sessions = 会话目录随会话删除：`suga data gc --retention`（或 --older-than）
session.recovered = 上一回合异常中断，已恢复会话（中断的回合记为 cancelled）
