<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>suga inspect trace</title>
<style>
:root { --bg:#fafafa; --fg:#222; --mute:#777; --line:#e3e3e3; --model:#5b8def; --read:#3fb27f; --write:#e39b2d; --shell:#9b6bd6; --err:#e5484d; --other:#8a8a8a; --mark:#c0c0c0; }
* { box-sizing: border-box; }
body { margin:0; font:13px/1.45 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color:var(--fg); background:var(--bg); }
header { padding:10px 16px; background:#fff; border-bottom:1px solid var(--line); }
header h1 { font-size:15px; margin:0 0 4px; }
.mute { color:var(--mute); }
.chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.chip { background:#f1f3f5; border-radius:10px; padding:2px 9px; font-size:12px; }
nav { display:flex; gap:4px; padding:6px 16px 0; background:#fff; border-bottom:1px solid var(--line); }
nav button { border:0; background:none; padding:6px 12px; cursor:pointer; border-bottom:2px solid transparent; font-size:13px; }
nav button.on { border-color:var(--model); color:var(--model); }
main { display:flex; height:calc(100vh - 118px); }
#left { flex:1.4; overflow:auto; border-right:1px solid var(--line); }
#detail { flex:1; overflow:auto; padding:10px 14px; background:#fff; }
.filters { position:sticky; top:0; background:#fff; padding:6px 10px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:8px; align-items:center; z-index:1; }
.filters label { font-size:12px; }
.filters input[type=search] { width:180px; padding:2px 6px; }
table.tl { border-collapse:collapse; width:100%; }
table.tl td { padding:2px 6px; border-bottom:1px solid #f0f0f0; white-space:nowrap; vertical-align:middle; }
table.tl tr { cursor:pointer; }
table.tl tr:hover { background:#f5f8ff; }
table.tl tr.sel { background:#e8efff; }
table.tl tr.turn td { background:#f3f3f3; font-weight:600; }
td.when { color:var(--mute); font-variant-numeric:tabular-nums; width:70px; }
td.kind { width:76px; }
td.what { max-width:420px; overflow:hidden; text-overflow:ellipsis; }
td.bar { width:34%; position:relative; }
.barw { position:relative; height:12px; }
.barw span { position:absolute; top:1px; height:10px; border-radius:2px; min-width:2px; }
.k { display:inline-block; padding:0 6px; border-radius:8px; font-size:11px; color:#fff; }
.indent { padding-left:22px !important; }
.err { color:var(--err); }
pre { white-space:pre-wrap; word-break:break-word; background:#f7f7f7; padding:8px; border-radius:4px; max-height:420px; overflow:auto; font:12px/1.4 ui-monospace, Consolas, monospace; }
h3 { font-size:13px; margin:12px 0 4px; }
table.kv td { padding:1px 8px 1px 0; vertical-align:top; font-size:12px; }
table.kv td:first-child { color:var(--mute); white-space:nowrap; }
details summary { cursor:pointer; color:var(--mute); }
.stack { display:flex; height:16px; border-radius:3px; overflow:hidden; margin:3px 0; background:#eee; }
.stack span { height:100%; }
.legend { display:flex; flex-wrap:wrap; gap:8px; font-size:11px; margin:6px 0; }
.legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:3px; vertical-align:-1px; }
.pane { padding:10px 16px; overflow:auto; width:100%; }
.callbars { display:flex; align-items:flex-end; gap:2px; height:160px; border-bottom:1px solid var(--line); }
.callbars div { flex:1; display:flex; flex-direction:column-reverse; min-width:3px; height:100%; }
.callbars span { display:block; width:100%; }
.envlist h4 { margin:10px 10px 2px; font-size:12px; color:var(--mute); }
.envlist div.item { padding:3px 10px 3px 18px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.envlist div.item:hover { background:#f5f8ff; }
.envlist div.item.sel { background:#e8efff; }
.ok { color:var(--read); } .diff { color:var(--err); }
header .refresh { margin-top:6px; font-size:12px; }
a.jump { color:var(--model); text-decoration:none; border-bottom:1px dotted var(--model); }
</style>
</head>
<body>
<header><h1 id="title">suga inspect trace</h1><div id="sub" class="mute"></div><div class="chips" id="chips"></div>
<div class="refresh"><label title="开启后只拉取新增：会话进行中每 5 秒，空闲时每 15 秒检查新回合"><input type="checkbox" id="auto"> 自动刷新</label> <span id="autostate" class="mute"></span></div></header>
<nav><button data-tab="timeline" class="on">时间线</button><button data-tab="context">上下文</button><button data-tab="analysis">分析</button><button data-tab="env">本机环境</button></nav>
<main id="main"></main>
<script>
"use strict";
const COLORS = { model:"var(--model)", read:"var(--read)", write:"var(--write)", shell:"var(--shell)", error:"var(--err)", other:"var(--other)", mark:"var(--mark)" };
const PARTS = [["system","系统提示","#5b8def"],["tools","工具定义","#8fb3f5"],["environment","环境","#3fb27f"],["rules","规则","#e39b2d"],["memory_index","记忆索引","#9b6bd6"],["skills","skills","#c58be0"],["append_prompt","追加提示","#d9b44a"],["deferred_tools","延迟工具","#a0c4ff"],["handoff","交接摘要","#ff9f80"],["history","历史","#b0b0b0"],["hook_context","hook 注入","#e5484d"],["input","本轮输入","#222"]];
const READ_TOOLS = new Set(["file_read","file_list","file_grep","file_find","recall","session_search","web_fetch","web_search","skill","tool_search","suga_manifest"]);
const WRITE_TOOLS = new Set(["file_write","file_edit","file_remove","update_plan","memory"]);
let data, t0, entryBySeq = new Map(), selected = null, tab = "timeline";
// Auto refresh: markSeq/markEvent mark what the page already has (they travel
// as since_seq / since_event), autoRefresh is the switch, pollTimer its timer.
let markSeq = 0, markEvent = 0, autoRefresh = false, pollTimer = null;
const POLL_RUNNING_MS = 5000, POLL_IDLE_MS = 15000;
const filt = { kinds: new Set(["turn","model","tool","denial","task","context","hook","fold","compaction"]), errors:false, slow:false, q:"" };

function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") n.className = v; else if (k === "style") n.style.cssText = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) n.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return n;
}
const human = n => n >= 1e6 ? (n/1e6).toFixed(2).replace(/\.?0+$/,"")+"M" : n >= 1e3 ? (n/1e3).toFixed(1).replace(/\.0$/,"")+"k" : String(n||0);
const secs = ms => ms >= 1000 ? (ms/1000).toFixed(1)+"s" : (ms||0)+"ms";
const at = e => new Date(e.start || e.time).getTime();
// clock is the local time of day; off the offset from the session start.
const clock = t => new Date(t).toLocaleTimeString("zh-CN", {hour12:false});
const off = ms => { const s = Math.max(0, ms/1000); return "+" + (s < 60 ? s.toFixed(1) + "s" : Math.floor(s/60) + ":" + (s%60).toFixed(1).padStart(4, "0")); };
// skillsText: how the skills listing presented the installed skills.
const skillsText = a => a.skills_total == null ? "" : `skills 描述 ${a.skills_listed||0} · 仅名称 ${a.skills_named||0} · 预载 ${a.skills_preloaded||0} / 共 ${a.skills_total}`;

function category(e) {
  if (e.status === "error" || e.kind === "denial" || e.attrs?.test_failed) return "error";
  if (e.kind === "model") return "model";
  if (e.kind === "tool") return e.name === "shell_exec" ? "shell" : READ_TOOLS.has(e.name) ? "read" : WRITE_TOOLS.has(e.name) ? "write" : "other";
  if (e.kind === "task") return "shell";
  return "mark";
}

// taskBadge: how a background task is named: a shell task by its id, a watch
// as a watch, a Stop hook by its summary, a sub-agent by its description
// (attrs.kind is the task's kind).
function taskBadge(e) {
  const a = e.attrs || {};
  if (a.kind === "watch") return "监听 " + e.name;
  if (a.kind === "hook") return (a.arg || "Stop hook") + " " + e.name;
  if (a.kind === "agent") return "子 agent " + String(a.arg || "").replace(/^agent:\s*/, "");
  return "后台 " + e.name;
}

// agentDesc: the label of a sub-agent call: the description argument when the
// page has the call, else the one in the event's argument summary (attrs.arg).
function agentDesc(e) {
  for (const seq of e.entries || []) {
    const en = entryBySeq.get(seq);
    if (en && en.args && en.args.description) return en.args.description;
  }
  const m = /(?:^|\s)description=(.*?)(?:\s+(?:background|prompt|type)=|$)/.exec((e.attrs || {}).arg || "");
  return m ? m[1] : "";
}

// badge: the label of the kind cell: a sub-agent call by its description, a
// background task by its kind, else the tool name or the event kind.
function badge(e) {
  if (e.kind === "task") return taskBadge(e);
  if (e.kind === "tool" && e.name === "agent") {
    const d = agentDesc(e);
    return "子 agent" + (d ? " " + d : "");
  }
  return e.kind === "tool" ? e.name : e.kind;
}

// agentSummary: what a sub-agent call spent, why it stopped and the command
// that opens its own trace; a background call only started a task (its row
// links to it), so the numbers arrive with the task row instead.
function agentSummary(e) {
  const a = e.attrs || {};
  if (a.steps == null) return a.arg || "";
  const parts = [`${a.steps} 步`, `in ${human(a.input_tokens)}（缓存 ${human(a.cache_read_tokens)}）`, `out ${human(a.output_tokens)}`];
  if (a.cost_usd) parts.push("$" + Number(a.cost_usd).toFixed(4));
  if (a.stop) parts.push("stop=" + a.stop);
  if (a.child_session_id) parts.push("suga inspect trace " + a.child_session_id + " --web");
  return parts.join(" · ");
}

// taskSummary: what a task ran, plus what a watch reported (how often its
// command ran and how often the result changed, or its last state) and the
// steps a background sub-agent ran.
function taskSummary(e) {
  const a = e.attrs || {};
  let extra = "";
  if (a.kind === "watch") extra = a.runs != null ? ` · ${a.runs} 次运行（${a.changes||0} 次变化）` : (a.progress ? " · " + a.progress : "");
  else if (a.kind === "agent") extra = ` · ${a.steps||0} 步`;
  return `${a.arg || ""} · exit=${a.exit_code} · ${human(a.bytes)}B / ${a.lines||0} 行` + extra + (e.error ? " · " + e.error : "");
}

function summary(e) {
  const a = e.attrs || {};
  switch (e.kind) {
    case "model": return `in ${human(e.input_tokens)} (缓存 ${human(e.cache_read_tokens)}) out ${human(e.output_tokens)}` + (a.tool_calls ? ` · ${a.tool_calls} 个调用` : "") + (a.prefix && a.prefix !== "append" ? ` · 前缀 ${a.prefix}` : "") + (a.finish === "truncated" ? " · 截断" : "") + (a.retries ? ` · 重试 ${a.retries} 次（${a.retry_reason}，等 ${(a.retry_wait_ms / 1000).toFixed(1)}s）` : "");
    case "task": return taskSummary(e);
    case "tool": case "denial": return e.name === "agent" ? agentSummary(e) : (a.arg || "") + (a.exit_code != null ? ` · exit=${a.exit_code}` : "") + (a.lines_added != null ? ` · +${a.lines_added}/-${a.lines_removed||0}` : "") + (a.approval && a.approval !== "rule" ? ` · 审批 ${a.approval}` : "") + (e.error ? " · " + e.error : "");
    case "context": return [`约 ${human(a.est_tokens)} / ${human(a.window)} tokens`, `工具 ${a.tools_count||0} 个`, skillsText(a)].filter(Boolean).join(" · ");
    case "hook": return [a.decision && "decision="+a.decision, a.additional_chars && "注入 "+a.additional_chars+" 字符", a.reason_chars && "reason "+a.reason_chars].filter(Boolean).join(" · ");
    case "fold": return `折叠 ${a.boundary}/${a.steps} 步，${human(a.chars_before)}→${human(a.chars_after)} 字符`;
    case "compaction": return `${e.name} ${a.reason||""} ${a.tokens_before ? human(a.tokens_before)+"→"+human(a.tokens_after) : ""}`;
    case "turn": return [e.status, a.stop_reason, a.prompt_chars != null && `输入 ${a.prompt_chars} 字符`, a.injected && "注入"].filter(Boolean).join(" · ");
    default: return e.name;
  }
}

function visible(e) {
  if (!filt.kinds.has(e.kind) && !(e.kind === "turn_context" && filt.kinds.has("context"))) return false;
  if (filt.errors && category(e) !== "error") return false;
  if (filt.slow && (e.duration_ms || 0) < 10000) return false;
  if (filt.q) {
    const hay = (e.name + " " + summary(e) + " " + JSON.stringify(e.attrs||{}) + " " + (e.entries||[]).map(s => { const en = entryBySeq.get(s); return en ? (en.content||"") + JSON.stringify(en.args||{}) : ""; }).join(" ")).toLowerCase();
    if (!hay.includes(filt.q.toLowerCase())) return false;
  }
  return true;
}

function renderHeader() {
  const s = data.session, a = data.analysis;
  document.getElementById("title").textContent = (s.title || "suga 会话") + " · " + s.id;
  const tc = data.events.find(e => e.kind === "turn_context");
  document.getElementById("sub").textContent = [s.cwd, tc && (tc.attrs.provider + "/" + tc.attrs.model), new Date(s.created_at).toLocaleString()].filter(Boolean).join(" · ");
  const chips = document.getElementById("chips"); chips.replaceChildren();
  const add = t => chips.append(el("span", {class:"chip"}, t));
  add(`模型调用 ${a.model_calls}（并行步 ${a.parallel_steps}）`); add(`工具调用 ${a.tool_calls}`);
  add(`输入 ${human(a.input_tokens)}（缓存 ${human(a.cache_read_tokens)}）· 输出 ${human(a.output_tokens)}`);
  add(`耗时 模型 ${secs(a.model_ms)} · 工具 ${secs(a.tool_ms)}`);
  add(`测试 ${a.test_runs} 次（通过后 ${a.test_runs_after_pass}）`);
  add(`阶段 探索 ${a.explore_steps} · 写入→转绿 ${a.write_to_green_steps < 0 ? "-" : a.write_to_green_steps} · 转绿后 ${a.after_green_steps < 0 ? "-" : a.after_green_steps}`);
  add(`未命中输入 ${human(a.uncached_input_tokens)}`);
  const errs = Object.values(a.tool_errors || {}).reduce((x, y) => x + y, 0); if (errs) add(`工具失败 ${errs}`);
}

function renderTimeline(main) {
  const left = el("div", {id:"left"}), detail = el("div", {id:"detail"}, el("p", {class:"mute"}, "点击左侧一行查看详情"));
  const kinds = [["turn","回合"],["model","模型"],["tool","工具"],["denial","拒绝"],["task","后台任务"],["context","上下文"],["hook","hook"],["fold","折叠"],["compaction","分段/压缩"]];
  const bar = el("div", {class:"filters"},
    kinds.map(([k, label]) => el("label", {}, el("input", {type:"checkbox", ...(filt.kinds.has(k) ? {checked:""} : {}), onchange: ev => { ev.target.checked ? filt.kinds.add(k) : filt.kinds.delete(k); draw(); }}), " " + label)),
    el("label", {}, el("input", {type:"checkbox", ...(filt.errors ? {checked:""} : {}), onchange: ev => { filt.errors = ev.target.checked; draw(); }}), " 仅错误"),
    el("label", {}, el("input", {type:"checkbox", ...(filt.slow ? {checked:""} : {}), onchange: ev => { filt.slow = ev.target.checked; draw(); }}), " 慢于 10s"),
    el("input", {type:"search", placeholder:"搜索参数/输出…", value: filt.q, oninput: ev => { filt.q = ev.target.value; draw(); }}));
  const table = el("table", {class:"tl"});
  left.append(bar, table);
  main.replaceChildren(left, detail);
  const end = Math.max(...data.events.map(e => at(e) + (e.duration_ms || 0)), t0 + 1);
  const span = end - t0;
  // A row shows a task where it started, not where its end event was stored.
  const rows = data.events.slice().sort((a, b) => at(a) - at(b));
  // A task event (name = task id) and the shell_exec that started it
  // (attrs.task_id) link to each other.
  const tasks = new Map(), starters = new Map();
  for (const e of data.events) {
    if (e.kind === "task") tasks.set(e.name, e);
    else if (e.attrs && e.attrs.task_id) starters.set(e.attrs.task_id, e);
  }
  function jump(label, target, hint) {
    return el("a", {class:"jump", href:"#ev=" + target.id, title:hint, onclick: ev => {
      ev.preventDefault(); ev.stopPropagation();
      selected = target; history.replaceState(null, "", "#ev=" + target.id);
      showDetail(detail, target); draw();
    }}, label);
  }
  function links(e) {
    if (e.kind === "task" && starters.has(e.name)) return [jump("启动行", starters.get(e.name), "跳到启动这个后台任务的 shell_exec")];
    if (e.attrs && e.attrs.task_id && tasks.has(e.attrs.task_id)) return [jump(taskBadge(tasks.get(e.attrs.task_id)), tasks.get(e.attrs.task_id), "跳到这个后台任务的横条")];
    return [];
  }
  function draw() {
    table.replaceChildren();
    let inModel = false;
    for (const e of rows) {
      if (e.kind === "model") inModel = true; else if (e.kind === "turn") inModel = false;
      if (!visible(e)) continue;
      const cat = category(e);
      const left = (at(e) - t0) / span * 100, width = Math.max((e.duration_ms || 0) / span * 100, 0.15);
      const what = el("td", {class:"what" + ((e.kind === "tool" || e.kind === "denial") && inModel ? " indent" : "") + (cat === "error" ? " err" : "")}, summary(e));
      const rel = links(e);
      if (rel.length) what.append(" ", ...rel);
      const tr = el("tr", {class: (e.kind === "turn" ? "turn " : "") + (selected === e ? "sel" : ""), onclick: () => { selected = e; history.replaceState(null, "", "#ev=" + e.id); showDetail(detail, e); draw(); }},
        el("td", {class:"when", title: off(at(e) - t0)}, clock(at(e))),
        el("td", {class:"kind"}, el("span", {class:"k", style:"background:" + COLORS[cat]}, badge(e))),
        what,
        el("td", {class:"mute"}, e.duration_ms ? secs(e.duration_ms) : ""),
        el("td", {class:"bar"}, el("div", {class:"barw"}, el("span", {style:`left:${left}%;width:${width}%;background:${COLORS[cat]}`}))));
      table.append(tr);
    }
  }
  draw();
  if (selected) showDetail(detail, selected);
}

function kv(obj) {
  return el("table", {class:"kv"}, Object.entries(obj).filter(([, v]) => v !== undefined && v !== null && v !== "").map(([k, v]) => el("tr", {}, el("td", {}, k), el("td", {}, typeof v === "object" ? JSON.stringify(v) : String(v)))));
}

function latestSegment(time) {
  let seg = null;
  for (const en of data.entries) if (en.type === "compaction" && new Date(en.time).getTime() <= time && en.raw?.context) seg = en.raw;
  return seg;
}

function stackBar(attrs) {
  const total = PARTS.reduce((s, [k]) => s + (attrs[k] || 0), 0) || 1;
  return el("div", {class:"stack", title: PARTS.map(([k, l]) => `${l} ${human(attrs[k]||0)}`).join("\n")}, PARTS.filter(([k]) => attrs[k]).map(([k, l, c]) => el("span", {style:`width:${attrs[k]/total*100}%;background:${c}`, title:`${l} ${human(attrs[k])} 字符`})));
}
const legend = () => el("div", {class:"legend"}, PARTS.map(([, l, c]) => el("span", {}, el("i", {style:"background:" + c}), l)));

function showDetail(box, e) {
  box.replaceChildren(el("h3", {}, `${e.kind} · ${e.name}`), el("div", {class:"mute"}, new Date(e.start).toLocaleString("zh-CN", {hour12:false}) + " · 会话开始后 " + off(at(e) - t0) + (e.duration_ms ? " · 耗时 " + secs(e.duration_ms) : "") + (e.ttft_ms ? " · TTFT " + secs(e.ttft_ms) : "")));
  if (e.error) box.append(el("pre", {class:"err"}, e.error));
  const tokens = {input: e.input_tokens, cache_read: e.cache_read_tokens, cache_write: e.cache_write_tokens, output: e.output_tokens};
  if (e.kind === "model") box.append(el("h3", {}, "token"), kv(tokens));
  if (e.kind === "context") {
    box.append(el("h3", {}, "上下文组成（字符）"), stackBar(e.attrs), legend(), kv(Object.fromEntries(PARTS.map(([k, l]) => [l, e.attrs[k] ? human(e.attrs[k]) : ""]))));
    if (e.attrs.skills_total != null) box.append(el("div", {class:"mute"}, skillsText(e.attrs)));
    const seg = latestSegment(at(e) + 1000);
    if (seg || e.attrs.tools_count) {
      box.append(el("h3", {}, "分段上下文原文"));
      // Tool schemas go with every request, not in the segment text: the names are recorded.
      const names = e.attrs.tool_names || [];
      const head = `工具定义（${e.attrs.tools_count || names.length} 个${e.attrs.tools_mcp ? "，MCP " + e.attrs.tools_mcp : ""}，${human(e.attrs.tools)} 字符）`;
      if (names.length) box.append(el("details", {open:""}, el("summary", {}, head), el("pre", {}, names.join("\n"))));
      else {
        // Sessions recorded before tool_names: name the tools the session called.
        const used = [...new Set(data.events.filter(x => x.kind === "tool" || x.kind === "denial").map(x => x.name))].sort();
        box.append(el("details", {open:""}, el("summary", {}, head),
          el("p", {class:"mute"}, "这次会话的记录没有工具名单（记录它的 suga 版本较旧）；本机当前的工具定义见「本机环境」页。下面是本会话调用过的工具："),
          el("pre", {}, used.join("\n") || "（没有调用工具）")));
      }
    }
    if (seg) {
      for (const [k, l] of PARTS) if (seg.context[k]) box.append(el("details", {}, el("summary", {}, `${l}（${human(seg.context[k].length)} 字符）`), el("pre", {}, seg.context[k])));
      if (seg.summary) box.append(el("details", {}, el("summary", {}, `交接摘要（${human(seg.summary.length)} 字符）`), el("pre", {}, seg.summary)));
    }
  }
  for (const seq of e.entries || []) {
    const en = entryBySeq.get(seq); if (!en) continue;
    if (en.args) box.append(el("h3", {}, "参数"), el("pre", {}, JSON.stringify(en.args, null, 2)));
    else if (en.role === "tool") box.append(el("h3", {class: en.is_error ? "err" : ""}, en.is_error ? "结果（错误）" : "结果"), el("pre", {}, en.content || ""));
    if (en.role === "assistant") {
      if (en.reasoning) box.append(el("details", {}, el("summary", {}, `思考（${human(en.reasoning.length)} 字符）`), el("pre", {}, en.reasoning)));
      if (en.content) box.append(el("h3", {}, "正文"), el("pre", {}, en.content));
      if (en.tool) box.append(el("div", {class:"mute"}, `→ 调用 ${en.tool}${en.batch ? "（并行批次 " + en.batch + "）" : ""}`));
    }
  }
  if (e.name === "agent" && e.attrs && e.attrs.child_session_id) {
    // The sub-agent ran in a session of its own: its events are there.
    box.append(el("h3", {}, "子会话"), el("pre", {}, "suga inspect trace " + e.attrs.child_session_id + " --web"));
  }
  box.append(el("h3", {}, "属性"), kv(e.attrs || {}));
}

// turnNumbers maps a turn id to the turn's 1-based position in the session.
function turnNumbers() {
  const m = new Map();
  data.events.filter(e => e.kind === "turn").forEach((e, i) => m.set(e.turn_id, i + 1));
  return m;
}

// userEntries are the session's user messages in order: what the person typed
// and what was injected instead. A background task notice is stored as a user
// entry but carries notice = true and is no input of the person; a steer carries
// steer = true (typed into the running turn).
function userEntries() { return data.entries.filter(en => en.type === "user"); }

function renderContext(main) {
  const pane = el("div", {class:"pane"});
  const ctxs = data.events.filter(e => e.kind === "context");
  pane.append(el("h3", {}, "每回合上下文组成（首次请求，字符）"), legend());
  if (!ctxs.length) pane.append(el("p", {class:"mute"}, "这个会话没有 context 事件（较早的版本不记录）。"));
  ctxs.forEach((e, i) => pane.append(el("div", {class:"mute"}, [`回合 ${i + 1}`, clock(at(e)), `约 ${human(e.attrs.est_tokens)} tokens`, `工具 ${e.attrs.tools_count||0} 个`, skillsText(e.attrs)].filter(Boolean).join(" · ")), stackBar(e.attrs)));
  const models = data.events.filter(e => e.kind === "model" && !(e.attrs || {}).purpose);
  const max = Math.max(...models.map(e => e.input_tokens + e.output_tokens), 1);
  pane.append(el("h3", {}, "每次模型调用的输入（深色 = 命中缓存）与输出"),
    el("div", {class:"callbars"}, models.map(e => el("div", {title:`in ${human(e.input_tokens)} 缓存 ${human(e.cache_read_tokens)} out ${human(e.output_tokens)}`},
      el("span", {style:`height:${e.cache_read_tokens / max * 100}%;background:#3a6fd8`}),
      el("span", {style:`height:${(e.input_tokens - e.cache_read_tokens) / max * 100}%;background:#a8c2f5`}),
      el("span", {style:`height:${e.output_tokens / max * 100}%;background:#e39b2d`})))),
    el("div", {class:"legend"}, el("span", {}, el("i", {style:"background:#3a6fd8"}), "缓存命中"), el("span", {}, el("i", {style:"background:#a8c2f5"}), "未命中输入"), el("span", {}, el("i", {style:"background:#e39b2d"}), "输出")));
  // The entries the model gets as user messages (the turn's input and what was
  // injected before a request), so a task notice is not read as the person's
  // input and a steer is shown as the input it was.
  const users = userEntries();
  if (users.length) {
    const nums = turnNumbers();
    pane.append(el("h3", {}, "各回合的 user entry（人的输入与注入）"));
    for (const en of users) {
      const kind = en.notice ? "后台任务通知" : (en.steer ? "插话" : "用户输入");
      const head = [nums.has(en.turn_id) ? `回合 ${nums.get(en.turn_id)}` : "回合 -", clock(at(en)),
        kind].join(" · ");
      const body = [el("summary", {class: en.notice ? "mute" : ""}, `${head}（${human((en.content || "").length)} 字符）`),
        el("pre", {}, en.content || "（空）")];
      pane.append(en.notice ? el("details", {}, ...body) : el("details", {open:""}, ...body));
    }
  }
  main.replaceChildren(pane);
}

function renderAnalysis(main) {
  main.replaceChildren(el("div", {class:"pane"}, el("h3", {}, "trace --analyze"), kv(data.analysis)));
}

// The 本机环境 tab: what a session in this directory would get on this
// machine now (/api/env, loaded once), with a check against what the
// session recorded last.
let env = null, envSel = "check";
const SHOWN = { listed:"列出描述", named:"仅名称", preloaded:"预载正文", counted:"仅计数" };

function lastEvent(kind) { for (let i = data.events.length - 1; i >= 0; i--) if (data.events[i].kind === kind) return data.events[i]; return null; }

function envChecks() {
  const tc = lastEvent("turn_context")?.attrs || {}, ctx = lastEvent("context")?.attrs || {}, m = env.manifest, rows = [];
  const add = (item, then, now, note) => rows.push({item, then: then ?? "-", now: now ?? "-", same: String(then) === String(now), note});
  add("suga 版本", tc.version, m.version);
  add("主模型", tc.provider && tc.provider + "/" + tc.model, m.models.main.provider + "/" + m.models.main.model);
  add("规则哈希", tc.rules_hash && tc.rules_hash.slice(0, 12), env.rules.hash && env.rules.hash.slice(0, 12), "规则文件或内容变了就不同");
  if (ctx.tool_names) {
    // A read-only session has no write tools: compare against the tools of its mode.
    const writeTool = new Set(env.manifest.tools.filter(t => t.needs_allow_write).map(t => t.name));
    const inMode = env.tools.map(t => t.name).filter(n => tc.mode === "allow_write" || !writeTool.has(n));
    const then = new Set(ctx.tool_names), now = new Set(inMode);
    const gone = [...then].filter(n => !now.has(n)), added = [...now].filter(n => !then.has(n));
    rows.push({item:`工具（${tc.mode === "allow_write" ? "可写" : "只读"}模式）`, then:`${then.size} 个`, now:`${now.size} 个`, same: !gone.length && !added.length,
      note: [gone.length && "会话有、本机无：" + gone.join(", ") + "（MCP 工具要运行时才有）", added.length && "本机多出：" + added.join(", ")].filter(Boolean).join("；")});
  }
  const st = env.skills_stats || {};
  if (ctx.skills_total != null) add("skills（描述/名称/预载/共）", `${ctx.skills_listed}/${ctx.skills_named}/${ctx.skills_preloaded}/${ctx.skills_total}`, `${st.listed||0}/${st.named||0}/${st.preloaded||0}/${st.total||0}`);
  return rows;
}

function envDetail(box, key) {
  const [kind, name] = key.split(":");
  box.replaceChildren();
  if (kind === "check") {
    box.append(el("h3", {}, "与会话记录核对（会话最后一回合 vs 本机现在）"),
      el("table", {class:"kv"}, el("tr", {}, el("td", {}, "项目"), el("td", {}, "会话"), el("td", {}, "本机"), el("td", {}, "")),
        envChecks().map(r => el("tr", {}, el("td", {}, r.item), el("td", {}, String(r.then)), el("td", {}, String(r.now)),
          el("td", {class: r.same ? "ok" : "diff"}, r.same ? "一致" : "不同" + (r.note ? "：" + r.note : ""))))),
      el("p", {class:"mute"}, "工作区：" + env.workspace));
  } else if (kind === "model") {
    box.append(el("h3", {}, "模型"), el("pre", {}, JSON.stringify(env.manifest.models, null, 2)));
  } else if (kind === "tool") {
    const t = env.tools.find(x => x.name === name), meta = env.manifest.tools.find(x => x.name === name);
    box.append(el("h3", {}, "工具 " + name), el("p", {}, t.description), el("h3", {}, "属性"), kv(meta || {}), el("h3", {}, "参数 schema"), el("pre", {}, JSON.stringify(t.input_schema || {}, null, 2)));
  } else if (kind === "skill") {
    const s = env.skills.find(x => x.name === name);
    box.append(el("h3", {}, "skill " + name), kv({呈现: SHOWN[s.shown] || s.shown, 位置: s.workspace ? "工作区" : "用户", 文件: s.path}), el("p", {}, s.description));
  } else if (kind === "skills") {
    box.append(el("h3", {}, "注入上下文的 skills 段"), el("div", {class:"mute"}, skillsText({skills_listed: env.skills_stats.listed, skills_named: env.skills_stats.named, skills_preloaded: env.skills_stats.preloaded, skills_total: env.skills_stats.total})), el("pre", {}, env.skills_text || "（无）"));
  } else if (kind === "rules") {
    box.append(el("h3", {}, `规则（rules.file = ${env.rules.file || "-"}）`), env.rules.error ? el("pre", {class:"err"}, env.rules.error) : "",
      el("table", {class:"kv"}, (env.rules.files || []).map(f => el("tr", {}, el("td", {}, f.exists ? human(f.bytes) + " 字节" : "不存在"), el("td", {}, f.path)))),
      el("h3", {}, "合并后的规则文本"), el("pre", {}, env.rules.text || "（无）"));
  } else if (kind === "hooks") {
    const h = env.hooks;
    box.append(el("h3", {}, "Hooks（仅 chat 运行）"), kv({状态: h.enabled ? "启用" : h.off ? "SUGA_HOOKS=off 关闭" : "未配置", 错误: h.error}), el("pre", {}, h.config || "（无 hooks 配置）"));
  } else if (kind === "mcp") {
    const s = env.mcp_servers.find(x => x.id === name);
    box.append(el("h3", {}, "MCP " + name), kv({命令: s.command, 参数: (s.args || []).join(" "), 环境变量: (s.env_keys || []).join(", ")}), el("p", {class:"mute"}, "工具列表需要启动服务后才有，这里不启动。"));
  } else if (kind === "memory") {
    box.append(el("h3", {}, "记忆后端"), el("pre", {}, JSON.stringify({memory: env.manifest.memory, write_policy: env.manifest.write_policy, taint: env.manifest.taint, output: env.manifest.output}, null, 2)));
  }
}

function renderEnv(main) {
  if (!env) {
    main.replaceChildren(el("p", {class:"pane mute"}, "读取本机环境…"));
    fetch("api/env").then(r => r.ok ? r.json() : r.text().then(t => Promise.reject(t)))
      .then(d => { env = d; if (tab === "env") renderEnv(main); })
      .catch(err => main.replaceChildren(el("pre", {class:"err pane"}, "读取本机环境失败：" + err)));
    return;
  }
  const left = el("div", {id:"left", class:"envlist"}), detail = el("div", {id:"detail"});
  const item = (key, label) => el("div", {class:"item" + (envSel === key ? " sel" : ""), title: label, onclick: () => { envSel = key; renderEnv(main); }}, label);
  const st = env.skills_stats || {};
  // DOM append does not flatten arrays (it would print "[object HTMLDivElement]").
  left.append(...[
    el("h4", {}, "核对"), item("check", "与会话记录核对"), item("model:", "模型 " + env.manifest.models.main.provider + "/" + env.manifest.models.main.model),
    el("h4", {}, `工具（${env.tools.length}）`), env.tools.map(t => item("tool:" + t.name, t.name)),
    el("h4", {}, `Skills（描述 ${st.listed||0} · 仅名称 ${st.named||0} · 预载 ${st.preloaded||0} / 共 ${st.total||0}）`), item("skills:", "注入的 skills 段"),
    env.skills.map(s => item("skill:" + s.name, `${s.name} · ${SHOWN[s.shown] || s.shown}`)),
    el("h4", {}, "规则"), item("rules:", `${(env.rules.files || []).filter(f => f.exists).length} 个文件（${env.rules.file || "-"}）`),
    el("h4", {}, "Hooks"), item("hooks:", env.hooks.enabled ? "已启用" : "未启用"),
    el("h4", {}, `MCP（${env.mcp_servers.length}）`), env.mcp_servers.map(s => item("mcp:" + s.id, s.id + " · " + s.command)),
    el("h4", {}, "记忆"), item("memory:", env.manifest.memory.map(x => x.scope + "=" + x.backend).join(" · "))].flat());
  main.replaceChildren(left, detail);
  envDetail(detail, envSel);
}

function render() {
  const main = document.getElementById("main");
  if (tab === "timeline") renderTimeline(main); else if (tab === "context") renderContext(main); else if (tab === "env") renderEnv(main); else renderAnalysis(main);
}

function setTab(name) {
  tab = name; document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x.dataset.tab === name)); render();
}
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));

// applyView merges a response into the page state: the first response (no
// delta) replaces it, an incremental one only appends what the page did not
// have yet.
function applyView(d) {
  const events = d.events || [], entries = d.entries || [];
  if (d.delta) {
    data.session = d.session || data.session;
    data.analysis = d.analysis || data.analysis;
    data.events = data.events.concat(events);
    data.entries = data.entries.concat(entries);
  } else {
    data = d; data.events = events; data.entries = entries;
  }
  for (const en of entries) entryBySeq.set(en.seq, en);
  // The server orders events by (start, id); a delta can carry an event that
  // started before one already on the page (a parallel call reported later),
  // so the merge keeps that order.
  data.events.sort((a, b) => at(a) - at(b) || a.id - b.id);
  data.entries.sort((a, b) => a.seq - b.seq);
  markEvent = data.events.reduce((m, e) => Math.max(m, e.id), markEvent);
  markSeq = data.entries.reduce((m, e) => Math.max(m, e.seq), markSeq);
  if (selected) selected = data.events.find(e => e.id === selected.id) || selected;
}

// applyResponse is the shared tail of a load: merge, redraw and arm the next
// poll.
function applyResponse(d) {
  applyView(d);
  updateAuto();
  renderHeader();
  render();
  schedulePoll();
}

// poll asks for the new part only: since_seq / since_event are what the page
// already shows.
function poll() {
  fetch(`api/session?since_seq=${markSeq}&since_event=${markEvent}`)
    .then(r => r.ok ? r.json() : r.text().then(t => Promise.reject(t)))
    .then(applyResponse)
    .catch(err => { setAutoState("拉取失败：" + err); schedulePoll(); });
}

// schedulePoll arms the next poll (nothing while the switch is off). The delay
// follows the session: every 5s while its turn runs, every 15s when it is idle
// and the page only checks whether a next turn started (the request carries the
// same markers, so an idle check sends nothing).
function schedulePoll() {
  clearTimeout(pollTimer);
  pollTimer = null;
  if (!autoRefresh) return;
  pollTimer = setTimeout(poll, (data.session.status || "") === "running" ? POLL_RUNNING_MS : POLL_IDLE_MS);
}

function setAutoState(text) { document.getElementById("autostate").textContent = text; }

// updateAuto says what the switch does right now.
function updateAuto() {
  if (!autoRefresh) { setAutoState("关闭"); return; }
  setAutoState((data.session.status || "") === "running" ? "进行中，每 5 秒拉取新增" : "空闲，每 15 秒检查新回合");
}

document.getElementById("auto").addEventListener("change", ev => {
  autoRefresh = ev.target.checked;
  updateAuto();
  if (autoRefresh) poll(); else schedulePoll();
});

fetch("api/session").then(r => r.ok ? r.json() : r.text().then(t => Promise.reject(t))).then(d => {
  applyView(d);
  t0 = Math.min(...data.events.map(at), ...data.entries.map(at), Date.now());
  // #tab=context or #ev=<event id> open a tab or select a row (shareable).
  const hash = new URLSearchParams(location.hash.slice(1));
  if (hash.get("ev")) selected = data.events.find(e => String(e.id) === hash.get("ev")) || null;
  renderHeader();
  updateAuto();
  setTab(hash.get("tab") || "timeline");
  schedulePoll(); // nothing while the switch is off
}).catch(err => { document.getElementById("main").replaceChildren(el("pre", {class:"err"}, String(err))); });
</script>
