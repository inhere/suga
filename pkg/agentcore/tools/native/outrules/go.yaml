# Go: build, vet and test output (see README.md for the fields).
rules:
  # go build is quiet on success; the rule mainly removes module-download and
  # compiler progress lines while retaining every source location on failure.
  - name: go-build
    match: '\bgo\s+build\b'
    drop:
      - '^\[exit code: 0\]$'
      - '^go: downloading '
      - '^go: added '
    failure:
      - '^#\s+\S+'
      - '^\S+\.go:\d+(?::\d+)?: '
      - '^undefined: '
      - '^build constraints exclude all Go files'
      - '^cannot load '
      - '^package .* is not in std'
    count:
      success: '^\[exit code: 0\]$'
    summary: 'go build: succeeded'

  # go vet emits compiler-style locations on failure. It is deliberately a
  # separate rule from go-test: go test may invoke vet, but its own package and
  # per-test summary must remain governed by go-test below.
  - name: go-vet
    match: '\bgo\s+vet\b'
    drop:
      - '^\[exit code: 0\]$'
      - '^go: downloading '
      - '^go: added '
    failure:
      - '^#\s+\S+'
      - '^\S+\.go:\d+(?::\d+)?: '
      - '^vet: '
      - '^found packages '
      - '^cannot find module '
      - '^go: errors parsing '
    count:
      success: '^\[exit code: 0\]$'
    summary: 'go vet: succeeded'

  - name: go-test
    match: '\bgo test\b'
    drop:
      - '^\s*=== (RUN|PAUSE|CONT|NAME)\s'
      - '^\s*--- (PASS|SKIP): '
      - '^PASS$'
      - '^\?\s+\S+\s+\[no test files\]$'
    block:
      start: '^\s*=== RUN\s'
      body: '^ {4}'
      pass: '^\s*--- PASS: '
      fail: '^\s*--- FAIL: '
    failure:
      - '^\s*--- FAIL: '
      - '^FAIL\b'
      - '^panic: '
      - '^\S+\.go:\d+:\d+: '
    count:
      packages: '^ok\s+\S+'
      passed: '^\s*--- PASS: '
    summary: 'go test: {packages} package(s) ok[, {passed} test(s) passed]'
