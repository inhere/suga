# suga configuration
# Copy to $SUGA_HOME/config.yaml (default ~/.suga/config.yaml); ${VAR} values are
# expanded from the environment or $SUGA_HOME/.env.

# Main model, "<provider>/<model>". The prefix must be a defined provider (the
# presets openai, anthropic, deepseek, or one under providers:); only the first
# "/" splits, otherwise the whole string is the model id of the provider of
# this setting. Overridden by SUGA_MODEL, then by --model.
model: bailian/glm-5

# Providers. openai / anthropic / deepseek are built in (default base_url and
# the api_key env OPENAI_API_KEY / ANTHROPIC_API_KEY / DEEPSEEK_API_KEY); an
# entry with the same id overrides them field by field. Any other id needs type.
providers:
  bailian:
    type: openai # openai (chat/completions) | openai-responses (Responses API) | anthropic
    base_url: "${BAILIAN_BASE_URL}" # openai type appends /chat/completions
    api_key: "${BAILIAN_API_KEY}"
    # Optional per-model overrides; the context window is otherwise derived
    # from the model name (unknown models: 128000).
    # models:
    #   glm-5:
    #     context_window: 128000
    #     max_output_tokens: 64000
    #     # Optional price in USD per million tokens; used for the cost shown by
    #     # `suga inspect stats` / usage_update when the provider reports no cost.
    #     price: {input: 0.27, output: 1.1, cache_read: 0.07, cache_write: 0}
    #   sonnet:
    #     # A model may use its own protocol and address (e.g. the Claude
    #     # models of a gateway whose other models speak OpenAI).
    #     type: anthropic
    #     base_url: "https://gateway.example/anthropic"
    # Optional extra request headers. "{{session_id}}" becomes the current suga
    # session id (skipped when there is none); User-Agent defaults to "suga".
    # headers:
    #   x-extra: "value"
    # Optional request timeouts for this provider (override timeouts.*):
    # timeouts:
    #   request: 60s
    #   response_header: 45s
    # Optional retry policy for this provider (overrides retry.*, same keys; the
    # fields left out keep the global value), e.g. give up sooner on a free
    # gateway:
    # retry:
    #   max_attempts: 2

  # OpenCode Go, OpenAI-compatible endpoint (needs the session header):
  # opencode-go:
  #   type: openai
  #   base_url: "https://opencode.ai/zen/go/v1"
  #   api_key: "${OPENCODE_API_KEY}"
  #   headers:
  #     x-opencode-session: "{{session_id}}"
  # OpenCode Go, Anthropic-compatible endpoint (appends /v1/messages):
  # opencode-go-claude:
  #   type: anthropic
  #   base_url: "https://opencode.ai/zen/go"
  #   api_key: "${OPENCODE_API_KEY}"
  #   headers:
  #     x-opencode-session: "{{session_id}}"
  # Override a preset, e.g. an Anthropic gateway:
  # anthropic:
  #   base_url: "https://gateway.example.com"
  #   # Claude type only, default off: add cache_control breakpoints (system
  #   # becomes a block array). Some gateways reject cache_control.
  #   prompt_cache: true

# Optional cheaper model for context summaries (same reference rules as model;
# a bare id uses the main model's provider). Unset: the turn's own model.
# compact_model: bailian/glm-4-flash

# Optional models tried in order when the main model fails.
# fallback_models:
#   - anthropic/claude-sonnet-4-6
#   - deepseek-chat # bare id: served by the main model's provider

# Background tasks: shell_exec background: true (write modes; with every /
# watch_paths a watch), agent background: true (every mode); the task tool
# lists, reads, waits for and kills them. run, chat and ACP.
# tasks:
#   max_running: 4          # per session
#   max_duration: 2h        # longer tasks are killed
#   max_output_bytes: 67108864
#   wake_on_exit: true      # chat: a task notice (end, watch change) starts a turn while chat waits

# Job deadline (run.deadline_env): name of the env var carrying this run's
# deadline as RFC3339. Gofer injects GOFER_JOB_DEADLINE for time-limited jobs -
# set it to that and every model request ends with a transient time/remaining
# hint (urgent wrap-up within the last 10% or 5 minutes; nothing is stored and
# the stable prompt prefix stays untouched). Empty (default) = off.
# run:
#   deadline_env: GOFER_JOB_DEADLINE

# Sub-agents: the agent tool hands a read-only exploration or research task to a
# model run in a session of its own and gets only its report back.
# agents:
#   enabled: true           # false: no agent tool
#   model: bailian/glm-4-flash  # same reference rules as model (a bare id uses
#                           # the main model's provider); unset: the session's
#                           # own model (--model included). A cheaper one saves cost.
#   max_steps: 30           # then it reports from what it has (wrap-up)
#   max_tokens: 400000      # uncached input + output of its model calls; then wrap-up
#   timeout: 10m            # soft: then wrap-up; cancelled 60s later

# Retries of a model request after a network error, HTTP 408/429/5xx or a
# broken response stream (every provider). Waits double from base_delay up to
# max_delay (+-20% jitter, a server's Retry-After is honoured) and fall back to
# base_delay after reset_after without a failure. Durations: 500ms / 30s / 2m,
# or seconds.
# retry:
#   max_attempts: 6   # attempts per request, the first included; 1 = no retries
#   base_delay: 1s
#   max_delay: 60s
#   reset_after: 10m
# A provider may override the fields it needs (providers.<id>.retry, same keys);
# the others keep the global policy. A provider that rejects the request itself
# (HTTP 400/422) is not retried and no fallback model is tried for it: only
# retryable failures (network, 408/429/5xx, a broken stream) and rejections that
# name that provider (401/403/404) move on to fallback_models.

# Timeouts of one model request. request bounds a non-streamed request as a
# whole (dial, TLS, headers, body); response_header bounds the wait for a
# streamed request's response headers - the streamed body itself has no timeout.
# Durations: 90s / 2m, or seconds; "off" (or 0) removes a bound. A provider may
# override both (providers.<id>.timeouts). Keep a per-attempt timeout well under
# retry.reset_after, or every retry starts over at base_delay instead of backing
# off further (the defaults: response_header 60s, reset_after 10m).
# timeouts:
#   request: 120s
#   response_header: 60s

# Context segments. Chat only: after idle_after without input, if the context
# has reached idle_min_ratio of the segment threshold, a new segment is started
# in the background (never during a turn; typing cancels it).
# context:
#   idle_after: 15m     # duration such as 30s / 15m, or seconds; 0 turns it off
#   idle_min_ratio: 0.65 # share of the threshold (window - reserve), 0..1
#   fold_every: 0       # history folding: fold older steps every N steps (e.g. 10); 0 (default) = off
#   fold_keep: 5        # steps kept whole (>= 1)

# Chat (the interactive terminal REPL).
#   markdown: true      # render the model's markdown (headings, bold, code blocks,
#                       # lists, quotes, links) in the terminal; false prints the
#                       # model's text exactly. Only a terminal with colors
#                       # renders it (NO_COLOR turns it off); run, stream-json and
#                       # ACP always keep the raw text.
#   agent_progress: summary # summary: one status line and completion totals; full:
#                           # show each child tool call; off: hide child progress
#   spinner: true       # show "思考中… 3s" while the model is asked for its next
#                       # message (every turn start and after every tool result),
#                       # erased as soon as it answers; false turns the line off.
#                       # Needs a terminal with colors, like markdown.
#   steering: true      # keep the input line available while a turn runs: Enter
#                       # inserts a message into the running turn (the model sees it
#                       # before its next request), Esc or a single Ctrl-C ends this
#                       # turn only (chat stays at the prompt), two Ctrl-C within 3s
#                       # leave chat. The keys arrive as bytes, so this works where
#                       # the console's Ctrl-C event does not (a ConPTY: Zed, Windows
#                       # Terminal); false keeps the turn cooked and takes Ctrl-C as
#                       # SIGINT (one press ends chat).
#   highlight_input: true # paint the line you submitted at the prompt (and the
#                       # messages delivered from elsewhere: suga send, a Stop hook
#                       # reply, a task notice) on a low-saturation background, so
#                       # your own words stand apart from the model's answer; the two
#                       # get different backgrounds. Needs a terminal with colors.
#   notify: auto        # long-turn/approval notification: auto | bell | osc9 | off
#   notify_after: 60s   # notify after a turn lasts at least this long
#   terminal_title: true # name the terminal's window/tab after the session:
#                       # "suga · <short name> · <session title>" (the session title,
#                       # its first message or the one a resumed session stores, cut
#                       # to 30 characters). The terminal's own title is saved at
#                       # startup and given back on exit (empty title, then xterm's
#                       # CSI 23;0t restore). Control characters are stripped, so a
#                       # prompt cannot inject an escape sequence. Needs a terminal
#                       # with colors, like markdown.
# chat:
#   markdown: true
#   agent_progress: summary
#   spinner: true
#   highlight_input: true
#   terminal_title: true
#   steering: true
#   history: true       # persist keyboard input in $SUGA_HOME/history.jsonl
#   history_size: 1000  # maximum saved input lines
#   # Ask before a file tool reaches outside the workspace and the added
#   # directories (--add-dir): the question authorizes the directory (read-only
#   # or read-write) for the rest of the session. run, ACP and a chat without a
#   # terminal never ask; they keep refusing such a path.
#   ask_outside_dirs: true
#   undo_confirm: true # :undo asks before changing files (default true)

# Project rules: one file per directory level, from the Git root (or cwd) down
# to cwd, plus $SUGA_HOME/AGENTS.md for the user level. Only a file name (no
# path) is accepted; set it to CLAUDE.md to read that one instead.
# rules:
#   file: AGENTS.md

# Workspace directory for file and shell tools
# Defaults to current working directory
workspace: ""

# SerpAPI key for web_search tool
serpapi_key: "" # or reference an env var, e.g. "${SERPAPI_KEY}"

# Global outbound proxy for model requests, web_fetch and web_search. Optional:
# without a url every caller keeps its previous behavior (web_fetch ignores
# environment proxies and checks the target IP; model/search follow
# HTTP_PROXY/HTTPS_PROXY/NO_PROXY). With a url only the sites listed below use
# the proxy, everything else connects directly; write "*" to proxy every host.
# network:
#   proxy:
#     url: "${SUGA_PROXY_URL}"   # http://, https:// or socks5://; credentials stay in .env
#     sites: ["api.openai.com", ".anthropic.com", "serpapi.com"]

# Optional MCP servers exposed as additional tool providers. A server is
# either stdio (command/args/env) or Streamable HTTP (url/headers); headers
# expand ${VAR} from the process environment or $SUGA_HOME/.env, so tokens stay
# out of the file. `transport` may be `stdio` or `streamable_http`; it defaults
# to the shape of the entry. Legacy `sse` is not supported.
mcp:
  servers: []
  # call_timeout_sec: 120   # bound on one MCP tool call
  # startup_timeout_sec: 30 # bound on one server's initialize + tools/list
  # servers:
  #   - id: filesystem
  #     command: npx
  #     args:
  #       - -y
  #       - "@modelcontextprotocol/server-filesystem"
  #       - ./workspace
  #     env:
  #       NODE_ENV: development
  #   - id: remote
  #     url: https://mcp.example.com/mcp
  #     transport: streamable_http
  #     headers:
  #       Authorization: "Bearer ${MCP_TOKEN}"

# Skills (SKILL.md under <workspace>/.agents/skills, <workspace>/skills,
# ~/.agents/skills). With more than list_max skills only workspace skills are
# listed with their description, the rest by name only (load by name, or
# search with skill(query=...)).
# always_load puts those skills' bodies in the prompt (as does
# "metadata: {always_load: true}" in a SKILL.md frontmatter).
# skills:
#   list_max: 15
#   always_load: []

# Max ReAct loop steps (model requests) of one turn, not of the session
max_steps: 240

# MCP tool schema deferral: auto (defer when schemas exceed ~10% of the context
# window) | always | never. Deferred tools are loaded via the tool_search tool.
tools:
  deferred: auto
  # Tools this machine already has and the agent should prefer: a command on PATH
  # or an mcp.servers id, plus one line of "when to use it". Available items are
  # listed in the environment section (missing ones are left out and only show up
  # in `suga inspect manifest` with a reason). A preferred MCP server is never deferred
  # (tools.deferred above), but it is still denied until it is allowed in
  # auto_allow / read_only_allow below; a preferred command still goes through the
  # shell_exec approval (e.g. an approval rule with command: ["rg *"]).
  # preferred:
  #   - name: rg
  #     kind: command
  #     when: 精确搜索文本或正则，优先于反复读取文件
  #   - name: codebase-memory-mcp
  #     kind: mcp
  #     when: 跨文件查符号与调用关系
  # File-tool checkpoints. Enabled by default; sensitive before-images live under
  # sessions/<id>/snapshots/. :undo and suga undo remain available when it is off.
  snapshots:
    enabled: true
    max_file_bytes: 16777216       # 16 MiB
    max_session_bytes: 268435456   # 256 MiB
    max_global_bytes: 1073741824   # 1 GiB
    keep_turns: 20
    keep_days: 7
    on_error: deny                 # deny | continue (continue marks writes unrecoverable)
  # chat only (run needs --allow-write; --read-only wins; ACP ignores it):
  # allow_write: true  # boolean, default false: enable file_write / shell_exec
  # chat only: ask (default) confirms every non-MCP tool outside the read-only
  # list (file_read, file_list, file_grep, file_find, web_fetch, web_search,
  # skill, update_plan, tool_search) on the terminal;
  # auto never asks. Without a terminal, tools needing confirmation are refused.
  # approval: ask
  # Approval rules are kept outside config.yaml. The default is enabled; these
  # settings control how $SUGA_HOME/approval-rules.yaml and
  # <workspace>/.suga/approval-rules.yaml are loaded.
  # approval_rules:
  #   enabled: true
  #   always_prefix_tokens: 2 # chat `a`: number of safe shell tokens to keep
  #   persist_ask: true      # ask after `a`/`d` whether to write the rule
  #   project_trust:         # absolute workspace path -> current file SHA-256
  #     /absolute/path/to/project: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  #
  # Each rule file contains only a rules list. `tool` may be a native-tool glob
  # or server/toolglob for MCP; `command` is for shell_exec and `path` is for
  # file_write/file_edit/file_remove. `action` is allow, ask or deny.
  #   rules:
  #     - tool: shell_exec
  #       command: ["go test *", "go build *"]
  #       action: allow
  #     - tool: file_write
  #       path: ["docs/**", "README*.md"]
  #       action: allow
  #     - tool: file_write
  #       path: ["**/.env", "**/*.pem"]
  #       action: deny
  # YAML anchors and aliases are rejected; each file is limited to 64 KiB and
  # 256 rules. Project allow rules require an exact workspace+content-hash trust.
  # max_output_bytes: 8000   # largest tool result kept whole in the session; larger ones are
  #                          # saved to ~/.suga/sessions/<id>/outputs/ and kept as ref + head/tail
  # max_spill_bytes: 1048576 # raw output cap of one tool call (native and MCP)
  # parallel_reads: true     # run a reply's file_read/list/grep/find calls concurrently
  # read_page_bytes: 32768   # one file_read page per file (most source files fit in one read)
  # minimize_output: true    # tidy shell results (test summaries, folded repeats, no colours); original kept as a ref.
  #                           # Rules: built-in, then $SUGA_HOME/output-rules.yaml, then <workspace>/.suga/output-rules.yaml
  # shell: ""                # shell_exec shell; default pwsh/powershell on Windows, sh elsewhere
  # shell_timeout_max: 600   # max seconds a shell_exec call may ask for (default 120 per call)
  # shell_background_after: 120s # foreground grace period; 0 disables handoff
  # Read-only directories outside the workspace (file_read/file_list/file_grep/file_find,
  # absolute paths). Writes stay in the workspace.
  # dependency_roots: true   # detect Go module cache, GOROOT/src, ~/.cargo/registry/src
  # standards_roots: true    # detect idev-std releases and workspace tmp/idev-std
  # read_roots: []           # extra directories, e.g. ["~/src/sdk"]
  # web_fetch:
  #   allow_private: false   # true lets web_fetch reach private/local addresses
  #   proxy: ""             # http://, https:// or socks5:// proxy for web_fetch, e.g. http://127.0.0.1:7890
  # No MCP tool is allowed by default: with both lists empty every MCP call is
  # refused. Entries are "server/toolglob" (a bare "toolglob" in auto_allow
  # matches that tool from any server; prefer the qualified form).
  # auto_allow applies to normal (non --read-only) runs:
  # auto_allow: ["gofer/gofer_*_list", "gofer/gofer_*_get", "gofer/gofer_work_report"]
  # --read-only uses ONLY read_only_allow (auto_allow never widens it) and
  # every entry must be server-qualified:
  # read_only_allow:
  #   - gofer/gofer_*_list
  #   - gofer/gofer_*_get
  #   - gofer/gofer_work_report
  #   - gofer/gofer_session_list

# Long-term memory (the memory tool). All keys are optional.
# memory:
#   write: auto            # auto (default) | off: the memory tool becomes read-only
#   # A session that read external content (web_fetch, web_search, MCP tools,
#   # session_search, recall, ...) is tainted. Its memory writes: ask (default:
#   # chat asks, ACP sends a permission request, run refuses) | deny | allow.
#   write_tainted: ask
#   # Extra tools that taint the session: on every result / only when their
#   # output was saved to a file. shell_exec is the default of taint_on_spill.
#   taint_tools: []
#   taint_on_spill: [shell_exec]
#   user:
#     backend: files       # files (default, $SUGA_HOME/memory/user) | exec
#   project:
#     # Unset: MEMORY.md at the repository root -> files (repository mode,
#     # entries in .suga/memory/); else .gofer/tracker there -> gofer; else
#     # files under $SUGA_HOME/projects/<key>/memory. Set to force one:
#     backend: files       # files | gofer | exec
#   # exec backend (per scope; the command is required and is never discovered):
#   # user:
#   #   backend: exec
#   #   command: my-memory-store
#   #   args: ["--db", "/path/to/store"]
#   #   timeout_sec: 10

# Chat hooks. Disabled unless hooks.command is set; SUGA_HOOKS=off disables
# them regardless. The command is an argv list (no shell) and receives each
# event as one JSON line on stdin.
# hooks:
#   command: [gofer, hook, generic, --agent, suga]
#   timeout_ms: 3000 # ordinary events (default 3000)
#   # Appended to the Stop event argv only. Always set stop_wait_sec together
#   # with it, or Stop is ended after timeout_ms.
#   stop_args: [--wait, "7140"]
#   stop_wait_sec: 7140 # Stop waits stop_wait_sec+2 seconds
#   stop_background: false # chat: run Stop as a background task that typing does not
#                          # interrupt; a block reply arrives as a task notice
#   # PostToolUse is sent only for tools matching these globs (none: never),
#   # renamed to "name" when set. Globs use path.Match; "*" does not match "/".
#   post_tool_use:
#     tools: ["*shell*", "*exec*"]
#     name: shell
