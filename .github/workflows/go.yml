name: Unit-Tests
on:
  pull_request:
    paths:
      - 'go.mod'
      - '**.go'
      - '**.yml'
  push:
    branches: # Only trigger branch pushes; tag pushes are ignored.
      - '**'
    paths:
      - 'go.mod'
      - '**.go'
      - '**.yml'

jobs:

  test:
    name: Test on go ${{ matrix.go_version }} and ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        go_version: ['1.26', stable]

    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Setup Go Faster
      uses: WillAbides/setup-go-faster@v1.19.0
      timeout-minutes: 3
      with:
        go-version: ${{ matrix.go_version }}

    # staticcheck 2026.2.1, pinned by reviewdog/action-staticcheck@v1, cannot
    # read the export data newer Go (1.27.2+) writes ("export data version 5 is
    # greater than maximum supported version 4"). go.mod targets Go 1.26, so
    # lint on the 1.26 leg.
    - name: Run staticcheck
      uses: reviewdog/action-staticcheck@v1
      if: ${{ matrix.os == 'ubuntu-latest' && matrix.go_version == '1.26' }}
      with:
        github_token: ${{ secrets.github_token }}
        # Change reviewdog reporter if you need [github-pr-check,github-check,github-pr-review].
        reporter: github-check
        # Report all results. [added,diff_context,file,nofilter].
        filter_mode: added
        # Exit with 1 when it finds at least one finding.
        fail_level: 'any'

    - name: Format check
      if: ${{ matrix.os == 'ubuntu-latest' && matrix.go_version == 'stable' }}
      run: |
        files="$(gofmt -l .)"
        if [ -n "$files" ]; then
          printf '%s\n' "$files"
          exit 1
        fi

    - name: Go vet
      if: ${{ matrix.os == 'ubuntu-latest' && matrix.go_version == 'stable' }}
      run: go vet ./...

    - name: Mod tidy
      run: |
        go mod tidy

    - name: Run unit tests
      # run: go test -v -cover ./...
      # must add " for profile.cov on Windows OS
      run: |
        go test -coverprofile="profile.cov" ${{ matrix.os == 'ubuntu-latest' && matrix.go_version == 'stable' && '-race' || '' }} ./...

    - name: Run Go pty smoke
      timeout-minutes: 5
      run: go test -tags ptye2e -count=1 ./test/ptye2e/

